<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manik</title>
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0d0d0d 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .loader-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 20, 0.95); backdrop-filter: blur(15px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 999; transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .loader-container.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .spinner {
            width: 60px; height: 60px; border-radius: 50%;
            background: conic-gradient(#ff7eb3, #ff758c, #ff7eb3);
            animation: spin 1s linear infinite;
            box-shadow: 0 0 20px rgba(255, 126, 179, 0.5);
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-text { color: #ff7eb3; font-weight: 600; font-size: 1.3rem; margin-top: 20px; text-shadow: 0 0 10px rgba(255, 126, 179, 0.5); }

        .app-container {
            width: 100%; max-width: 950px;
            background: rgba(20, 20, 35, 0.8); backdrop-filter: blur(30px);
            border-radius: 40px; box-shadow: 0 40px 60px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,126,179,0.2);
            padding: 25px 25px; opacity: 0; transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s ease;
            border: 1px solid rgba(255,126,179,0.3);
            display: flex; gap: 20px; align-items: flex-start;
        }
        .app-container.visible { opacity: 1; transform: translateY(0); }

        .calendar-wrapper { flex: 1; transition: all 0.4s ease; }
        .calendar-wrapper.shifted { transform: translateX(-20px); flex: 0.7; }

        .master-panel {
            width: 0; overflow: hidden; background: rgba(255,126,179,0.05);
            border-radius: 20px; padding: 0; transition: all 0.4s ease; opacity: 0;
        }
        .master-panel.active { width: 250px; padding: 15px; opacity: 1; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .logo {
            font-size: 2.4rem; font-weight: 700;
            background: linear-gradient(45deg, #ff7eb3, #ff758c, #ff7eb3);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(255,126,179,0.3);
            animation: gradientShift 3s infinite alternate;
        }
        @keyframes gradientShift { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }

        .menu-btn {
            background: linear-gradient(135deg, #ff7eb3, #ff758c); border: none;
            color: white; font-weight: 600; padding: 10px 20px; border-radius: 25px;
            cursor: pointer; font-size: 0.9rem; transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255,126,179,0.4); display: flex; align-items: center; gap: 8px;
        }
        .menu-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,126,179,0.6); }
        .menu-btn:active { transform: scale(0.95); }

        .dropdown { position: relative; display: inline-block; }
        .dropdown-content {
            display: none; position: absolute; right: 0; top: 50px;
            background: rgba(25,25,45,0.95); backdrop-filter: blur(20px);
            border-radius: 20px; min-width: 220px; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            z-index: 100; padding: 10px; border: 1px solid rgba(255,126,179,0.4);
        }
        .dropdown-content button {
            display: block; width: 100%; background: transparent; border: none;
            color: white; padding: 10px 15px; text-align: left; border-radius: 12px;
            margin-bottom: 5px; transition: all 0.2s ease; font-weight: 500;
        }
        .dropdown-content button:hover { background: rgba(255,126,179,0.2); transform: translateX(5px); }
        .dropdown-content button:last-child { margin-bottom: 0; }
        .show { display: block; animation: fadeInDropdown 0.3s ease; }
        @keyframes fadeInDropdown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin: 20px 0; }
        .month-year {
            font-size: 1.5rem; font-weight: 600; color: #ff7eb3;
            background: rgba(255,126,179,0.1); padding: 8px 25px;
            border-radius: 25px; box-shadow: 0 0 15px rgba(255,126,179,0.3);
        }
        .nav-btn {
            background: rgba(255,126,179,0.2); border: none; width: 45px; height: 45px;
            border-radius: 50%; color: #ff7eb3; font-size: 1.4rem; cursor: pointer;
            transition: all 0.3s ease; display: flex; align-items: center; justify-content: center;
        }
        .nav-btn:hover { background: rgba(255,126,179,0.5); box-shadow: 0 0 20px rgba(255,126,179,0.6); }

        .weekdays { display: grid; grid-template-columns: repeat(7,1fr); text-align: center; color: #ff7eb3; margin-bottom: 5px; }
        .days-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 8px; margin: 20px 0; }
        .day-cell {
            aspect-ratio: 1/1; background: rgba(255,255,255,0.05); border-radius: 15px;
            display: flex; align-items: center; justify-content: center; font-weight: 500;
            color: #eee; cursor: pointer; transition: all 0.3s ease; border: 1px solid transparent;
            animation: fadeInCell 0.4s ease backwards; position: relative;
        }
        @keyframes fadeInCell { from { opacity: 0; transform: scale(0.7); } to { opacity: 1; transform: scale(1); } }
        .day-cell:hover:not(.day-off):not(.other-month) {
            background: rgba(255,126,179,0.3); transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255,126,179,0.4); border-color: #ff7eb3;
        }
        .day-cell.today { border: 2px solid #ff7eb3; color: #ff7eb3; }
        .day-cell.selected { background: linear-gradient(135deg, #ff7eb3, #ff758c); color: white; box-shadow: 0 0 20px rgba(255,126,179,0.7); }
        .day-cell.selected-multi { background: #f9c2d2; color: #5c2d43; font-weight: 600; border: 2px solid #ff7eb3; }
        .day-cell.other-month { color: #555; opacity: 0.4; cursor: default; }
        .day-cell.day-off { background: rgba(100,100,100,0.2); color: #888; text-decoration: line-through; }
        .day-cell.has-appointments::before {
            content: ''; position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
            width: 6px; height: 6px; background: #ff7eb3; border-radius: 50%;
        }

        .time-slots { display: flex; flex-wrap: wrap; gap: 10px; margin: 15px 0; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .time-slot {
            padding: 10px 20px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,126,179,0.3); border-radius: 25px;
            color: #eee; cursor: pointer; transition: all 0.3s ease;
        }
        .time-slot:hover:not(.booked):not(.unavailable) {
            background: rgba(255,126,179,0.3); transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,126,179,0.4);
        }
        .time-slot.selected-time { background: #ff7eb3; color: white; box-shadow: 0 0 20px rgba(255,126,179,0.7); }
        .time-slot.booked, .time-slot.unavailable { background: rgba(80,80,80,0.4); color: #aaa; text-decoration: line-through; cursor: not-allowed; }

        .booking-form {
            display: flex; flex-direction: column; gap: 12px; margin-top: 20px;
            background: rgba(255,255,255,0.03); border-radius: 25px; padding: 25px;
            backdrop-filter: blur(10px); border: 1px solid rgba(255,126,179,0.2);
            animation: fadeIn 0.6s ease;
        }
        .booking-form input, .booking-form textarea {
            padding: 12px 20px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,126,179,0.4); border-radius: 25px;
            color: white; font-size: 1rem; outline: none; transition: all 0.3s ease;
        }
        .booking-form input:focus, .booking-form textarea:focus {
            border-color: #ff7eb3; box-shadow: 0 0 15px rgba(255,126,179,0.4);
        }
        .book-btn {
            background: linear-gradient(135deg, #ff7eb3, #ff758c); border: none;
            color: white; font-weight: 600; padding: 14px; border-radius: 30px;
            font-size: 1.1rem; cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(255,126,179,0.5);
        }
        .book-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(255,126,179,0.7); }

        /* Модальные окна */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center;
            z-index: 200; opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        .modal.active { opacity: 1; visibility: visible; }
        .modal-content {
            background: rgba(25,25,45,0.95); backdrop-filter: blur(25px);
            border-radius: 30px; padding: 30px; max-width: 450px; width: 90%;
            border: 1px solid rgba(255,126,179,0.4); box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            transform: scale(0.9); transition: transform 0.3s ease;
        }
        .modal.active .modal-content { transform: scale(1); }
        .modal-content input, .modal-content select, .modal-content textarea {
            width: 100%; margin: 10px 0; padding: 12px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,126,179,0.3);
            border-radius: 20px; color: white;
        }
        .modal-btn {
            padding: 10px 25px; border-radius: 25px; font-weight: 600;
            cursor: pointer; border: none; margin: 5px; transition: all 0.3s ease;
        }
        .btn-primary { background: linear-gradient(135deg, #ff7eb3, #ff758c); color: white; box-shadow: 0 5px 20px rgba(255,126,179,0.5); }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #ddd; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,126,179,0.7); }
        .btn-secondary:hover { background: rgba(255,255,255,0.2); }

        /* Архив */
        .archive-container { display: flex; gap: 20px; max-height: 70vh; }
        .archive-years-panel {
            width: 90px; background: rgba(255,255,255,0.03); border-radius: 20px;
            padding: 15px; overflow-y: auto; flex-shrink: 0;
        }
        .archive-years-panel button {
            display: block; width: 100%; background: transparent; border: none;
            color: #ccc; padding: 10px; border-radius: 12px; margin-bottom: 6px;
            cursor: pointer; font-weight: 500; transition: all 0.2s;
        }
        .archive-years-panel button:hover, .archive-years-panel button.active {
            background: rgba(255,126,179,0.2); color: #ff7eb3;
        }
        .archive-main { flex: 1; overflow-y: auto; }
        .archive-months-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
        }
        .archive-month-card {
            background: rgba(255,255,255,0.05); border-radius: 16px;
            padding: 20px 10px; text-align: center; cursor: pointer;
            color: #ddd; transition: all 0.3s; border: 1px solid transparent;
        }
        .archive-month-card:hover { background: rgba(255,126,179,0.15); border-color: #ff7eb3; }
        .archive-month-card.has-records { border-color: #ff7eb3; }
        .archive-calendar { margin-top: 15px; }
        .archive-detail { margin-top: 15px; background: rgba(255,126,179,0.05); border-radius: 16px; padding: 15px; }

        .login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10,10,20,0.95); backdrop-filter: blur(15px);
            display: flex; justify-content: center; align-items: center; z-index: 300;
        }
        .tab-buttons { display: flex; margin-bottom: 20px; }
        .tab-btn {
            flex: 1; padding: 10px; border-radius: 20px; border: none;
            font-weight: 600; cursor: pointer; transition: all 0.3s ease;
        }
        .tab-btn.active { background: linear-gradient(135deg, #ff7eb3, #ff758c); color: white; }
        .tab-btn:not(.active) { background: rgba(255,255,255,0.1); color: #ddd; }
    </style>
</head>
<body>
<div class="loader-container" id="loader">
    <div class="spinner"></div>
    <div class="loader-text">Manik загружается...</div>
</div>

<!-- Экран входа -->
<div class="login-screen" id="loginScreen">
    <div class="modal-content" style="max-width: 400px;">
        <div class="tab-buttons">
            <button class="tab-btn active" id="showLoginTab">Войти</button>
            <button class="tab-btn" id="showRegisterTab">Регистрация</button>
        </div>
        <div id="loginForm">
            <input type="email" id="loginEmail" placeholder="Email" required>
            <input type="password" id="loginPassword" placeholder="Пароль" required>
            <button class="modal-btn btn-primary" id="loginSubmitBtn" style="width:100%;">Войти</button>
            <a href="#" id="forgotPasswordLink" style="color:#ff7eb3; display:block; text-align:center; margin-top:10px; font-size:0.9rem;">Забыли пароль?</a>
        </div>
        <div id="registerForm" style="display:none;">
            <input type="email" id="registerEmail" placeholder="Email" required>
            <input type="password" id="registerPassword" placeholder="Пароль" required>
            <input type="text" id="registerMasterKey" placeholder="Ключ мастера (если есть)">
            <button class="modal-btn btn-primary" id="registerSubmitBtn" style="width:100%;">Зарегистрироваться</button>
        </div>
        <p id="loginError" style="color:#ff7eb3; margin-top:10px; display:none; text-align:center;"></p>
    </div>
</div>

<!-- Модальное окно восстановления пароля -->
<div class="modal" id="forgotPasswordModal">
    <div class="modal-content">
        <h3 style="color:#ff7eb3;">Восстановление пароля</h3>
        <input type="email" id="forgotEmail" placeholder="Ваш email">
        <button class="modal-btn btn-primary" id="sendResetBtn">Отправить ссылку</button>
        <button class="modal-btn btn-secondary" id="closeForgotModal">Отмена</button>
    </div>
</div>

<!-- Остальные модальные окна -->
<div class="modal" id="messageModal">
    <div class="modal-content">
        <p id="messageText" style="color:#ddd;"></p>
        <button class="modal-btn btn-primary" id="closeMessageModal">OK</button>
    </div>
</div>

<div class="modal" id="aiChatModal">
    <div class="modal-content" style="max-width:500px;">
        <h3 style="color:#ff7eb3;">🤖 ИИ консультант по маникюру</h3>
        <div class="chat-container" id="chatContainer"></div>
        <input type="text" id="chatInput" placeholder="Опишите, что хотите...">
        <button class="modal-btn btn-primary" id="sendChatBtn">Спросить</button>
        <button class="modal-btn btn-secondary" id="closeAiChatBtn">Закрыть</button>
    </div>
</div>

<div class="modal" id="blacklistModal">
    <div class="modal-content">
        <h3 style="color:#ff7eb3;">Чёрный список</h3>
        <div id="blacklistList"></div>
        <input type="text" id="newBlacklistPhone" placeholder="Номер">
        <button class="modal-btn btn-primary" id="addBlacklistBtn">Добавить</button>
        <button class="modal-btn btn-secondary" id="closeBlacklistModal">Закрыть</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCetvGM77zUc_Llh5p-FLTF6PkvH-lCPQ8",
        authDomain: "manik-56a31.firebaseapp.com",
        projectId: "manik-56a31",
        storageBucket: "manik-56a31.firebasestorage.app",
        messagingSenderId: "540265958043",
        appId: "1:540265958043:web:f3dd0d7ee6b9c9ffbe543e",
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();
    db.enablePersistence().catch(() => {});

    let masterKey = null;
    let currentMonth = new Date().getMonth();
    let currentYear = new Date().getFullYear();
    let selectedDate = null;
    let selectedTime = null;
    let isAdmin = false;
    let multiSelectMode = false;
    let selectedDaysSet = new Set();
    let appointments = {};
    let daysOff = [];
    let blacklist = [];
    const allTimeSlots = ['08:00','10:00','12:00','14:00','16:00','18:00'];
    let firstLoadCompleted = false;
    let currentUser = null;

    const loader = document.getElementById('loader');
    const appContainer = document.getElementById('appContainer');
    const calendarWrapper = document.getElementById('calendarWrapper');
    const masterPanel = document.getElementById('masterPanel');
    const loginScreen = document.getElementById('loginScreen');
    const loginError = document.getElementById('loginError');
    const dropdownMenu = document.getElementById('dropdownMenu');
    const menuBtn = document.getElementById('menuBtn');
    const archiveBtn = document.getElementById('archiveBtn');
    const myBookingsBtn = document.getElementById('myBookingsBtn');
    const aiChatBtn = document.getElementById('aiChatBtn');
    const searchWindowBtn = document.getElementById('searchWindowBtn');
    const blacklistBtn = document.getElementById('blacklistBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const monthYearEl = document.getElementById('monthYear');
    const daysGridEl = document.getElementById('daysGrid');
    const selectedDateDisplay = document.getElementById('selectedDateDisplay');
    const timeSelectionArea = document.getElementById('timeSelectionArea');
    let timeSlotsContainer = document.getElementById('timeSlotsContainer');
    const bookingFormArea = document.getElementById('bookingFormArea');
    const bookBtn = document.getElementById('bookBtn');
    const clientNameInput = document.getElementById('clientName');
    const clientPhoneInput = document.getElementById('clientPhone');
    const clientNoteInput = document.getElementById('clientNote');
    const designFileInput = document.getElementById('designFile');
    const adminBookings = document.getElementById('adminBookings');
    const bookingsContainer = document.getElementById('bookingsContainer');
    const toggleDayOffBtn = document.getElementById('toggleDayOffBtn');
    const multiSelectBtn = document.getElementById('multiSelectBtn');
    const applyMultiOffBtn = document.getElementById('applyMultiOffBtn');
    const applyMultiWorkBtn = document.getElementById('applyMultiWorkBtn');
    const messageModal = document.getElementById('messageModal');
    const aiChatModal = document.getElementById('aiChatModal');
    const blacklistModal = document.getElementById('blacklistModal');
    const chatContainer = document.getElementById('chatContainer');
    const chatInput = document.getElementById('chatInput');
    const forgotPasswordModal = document.getElementById('forgotPasswordModal');

    const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

    menuBtn.addEventListener('click', (e) => { e.stopPropagation(); dropdownMenu.classList.toggle('show'); });
    window.addEventListener('click', () => dropdownMenu.classList.remove('show'));

    function showMessage(text) {
        document.getElementById('messageText').textContent = text;
        messageModal.classList.add('active');
    }
    document.getElementById('closeMessageModal').addEventListener('click', () => messageModal.classList.remove('active'));

    async function loadMasterKey() {
        try {
            const doc = await db.collection('settings').doc('masterKey').get();
            masterKey = doc.exists ? doc.data().key : null;
        } catch(e) { console.error(e); }
    }
    async function loadData() {
        const [daysSnap, apptSnap] = await Promise.all([
            db.collection('daysOff').get(),
            db.collection('appointments').get()
        ]);
        daysOff = daysSnap.docs.map(d => d.id);
        appointments = {};
        apptSnap.forEach(doc => {
            const data = doc.data();
            const dateKey = doc.id.split('_')[0];
            if (!appointments[dateKey]) appointments[dateKey] = [];
            appointments[dateKey].push({...data, docId: doc.id});
        });
    }
    function loadBlacklist() {
        return db.collection('blacklist').get().then(snap => { blacklist = snap.docs.map(d => d.id); });
    }

    function showLoginScreen() { loginScreen.style.display = 'flex'; appContainer.classList.remove('visible'); loader.classList.add('hidden'); }
    function hideLoginScreen() { loginScreen.style.display = 'none'; }
    function logout() { auth.signOut(); hideLoginScreen(); showLoginScreen(); }

    // Забыли пароль (модальное окно)
    document.getElementById('forgotPasswordLink').addEventListener('click', (e) => {
        e.preventDefault();
        forgotPasswordModal.classList.add('active');
    });
    document.getElementById('sendResetBtn').addEventListener('click', async () => {
        const email = document.getElementById('forgotEmail').value.trim();
        if (!email) { showMessage('Введите email'); return; }
        try {
            await auth.sendPasswordResetEmail(email);
            forgotPasswordModal.classList.remove('active');
            showMessage('Ссылка для сброса пароля отправлена на ' + email);
        } catch (err) {
            showMessage('Ошибка: ' + err.message);
        }
    });
    document.getElementById('closeForgotModal').addEventListener('click', () => forgotPasswordModal.classList.remove('active'));

    async function initializeAuth() {
        await loadMasterKey();
        auth.onAuthStateChanged(async (user) => {
            if (!user) { currentUser = null; isAdmin = false; showLoginScreen(); return; }
            currentUser = user;
            const masterDoc = await db.collection('masters').doc(user.uid).get();
            isAdmin = masterDoc.exists;
            hideLoginScreen();
            if (!firstLoadCompleted) {
                await loadData();
                await loadBlacklist();
                firstLoadCompleted = true;
                finishLoading();
            }
            updateUIForRole();
            renderAll();
        });

        document.getElementById('showLoginTab').addEventListener('click', () => {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('showLoginTab').classList.add('active');
            document.getElementById('showRegisterTab').classList.remove('active');
        });
        document.getElementById('showRegisterTab').addEventListener('click', () => {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            document.getElementById('showRegisterTab').classList.add('active');
            document.getElementById('showLoginTab').classList.remove('active');
        });
        document.getElementById('loginSubmitBtn').addEventListener('click', async () => {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            if (!email || !password) { loginError.textContent = 'Введите email и пароль'; loginError.style.display = 'block'; return; }
            try { await auth.signInWithEmailAndPassword(email, password); }
            catch (err) { loginError.textContent = 'Ошибка: ' + err.message; loginError.style.display = 'block'; }
        });
        document.getElementById('registerSubmitBtn').addEventListener('click', async () => {
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value.trim();

    function formatDateKey(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    function isToday(d) { const t=new Date(); return d.getFullYear()===t.getFullYear() && d.getMonth()===t.getMonth() && d.getDate()===t.getDate(); }
    function isDayOff(dk) { return daysOff.includes(dk); }
    function getBookedSlotsForDate(d) { const k=formatDateKey(d); return appointments[k] ? appointments[k].map(a=>a.time) : []; }
    function isPastSlot(d,time) { if(!isToday(d)) return false; const [h,m]=time.split(':').map(Number); const end=new Date(d.getFullYear(),d.getMonth(),d.getDate(),h+2,m); return end <= new Date(); }
    function isDateInPast(d) { const tomorrow=new Date(); tomorrow.setDate(tomorrow.getDate()+1); tomorrow.setHours(0,0,0,0); return new Date(d.getFullYear(),d.getMonth(),d.getDate()) < tomorrow; }

    function renderCalendar() {
        monthYearEl.textContent = `${monthNames[currentMonth]} ${currentYear}`;
        const firstDay = new Date(currentYear, currentMonth, 1).getDay();
        const daysInMonth = new Date(currentYear, currentMonth+1, 0).getDate();
        const prevMonthDays = new Date(currentYear, currentMonth, 0).getDate();
        let html = '';
        for (let i = firstDay-1; i >= 0; i--) html += `<div class="day-cell other-month">${prevMonthDays - i}</div>`;
        for (let d=1; d<=daysInMonth; d++) {
            const date = new Date(currentYear, currentMonth, d);
            const dk = formatDateKey(date);
            let cls = 'day-cell';
            if (isToday(date)) cls += ' today';
            if (!multiSelectMode && selectedDate && formatDateKey(selectedDate)===dk) cls += ' selected';
            if (multiSelectMode && selectedDaysSet.has(dk)) cls += ' selected-multi';
            if (isDayOff(dk)) cls += ' day-off';
            if (appointments[dk]?.length) cls += ' has-appointments';
            html += `<div class="${cls}" data-date="${dk}" style="animation-delay:${d*0.02}s">${d}</div>`;
        }
        const total = firstDay + daysInMonth;
        const rem = total%7 ? 7 - total%7 : 0;
        for (let d=1; d<=rem; d++) html += `<div class="day-cell other-month">${d}</div>`;
        daysGridEl.innerHTML = html;
        document.querySelectorAll('.day-cell[data-date]').forEach(cell => {
            cell.addEventListener('click', function() {
                const dk = this.dataset.date;
                if (multiSelectMode && isAdmin) {
                    if (selectedDaysSet.has(dk)) selectedDaysSet.delete(dk);
                    else selectedDaysSet.add(dk);
                    renderCalendar();
                    updateMultiButtons();
                    return;
                }
                const [y,m,d] = dk.split('-').map(Number);
                selectedDate = new Date(y,m-1,d);
                selectedTime = null;
                updateUIForSelectedDate();
                renderCalendar();
                updateMasterPanelButtons();
            });
        });
    }

    function updateUIForSelectedDate() {
        if (!selectedDate || multiSelectMode) {
            selectedDateDisplay.innerHTML = '📅 Дата не выбрана';
            timeSelectionArea.style.display = 'none';
            bookingFormArea.style.display = 'none';
            return;
        }
        const dk = formatDateKey(selectedDate);
        selectedDateDisplay.innerHTML = `📅 ${selectedDate.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}`;
        timeSelectionArea.innerHTML = '<div style="font-weight:600;color:#ff7eb3;margin-bottom:5px;">Доступное время (2 часа):</div><div class="time-slots" id="timeSlotsContainer"></div>';
        timeSlotsContainer = document.getElementById('timeSlotsContainer');
        timeSelectionArea.style.display = 'block';
        if (isDateInPast(selectedDate)) {
            timeSelectionArea.innerHTML = '<div style="color:#ff7eb3;text-align:center;">⛔ Запись только с завтрашнего дня</div>';
            bookingFormArea.style.display = 'none';
            return;
        }
        if (isDayOff(dk)) { timeSelectionArea.style.display = 'none'; bookingFormArea.style.display = 'none'; return; }
        const booked = getBookedSlotsForDate(selectedDate);
        let slotsHtml = '';
        allTimeSlots.forEach(time => {
            const end = `${parseInt(time)+2}:00`;
            const isB = booked.includes(time);
            const past = isPastSlot(selectedDate, time);
            let cls = 'time-slot';
            if (isB) cls+=' booked'; else if (past) cls+=' unavailable';
            if (selectedTime===time && !isB && !past) cls+=' selected-time';
            slotsHtml += `<div class="${cls}" data-time="${time}">${time}<small> до ${end}</small></div>`;
        });
        timeSlotsContainer.innerHTML = slotsHtml;
        if (selectedTime && (booked.includes(selectedTime) || isPastSlot(selectedDate,selectedTime))) selectedTime=null;
        bookingFormArea.style.display = selectedTime ? 'flex' : 'none';
        document.querySelectorAll('.time-slot:not(.booked):not(.unavailable)').forEach(s=>{
            s.addEventListener('click', function(){
                const t = this.dataset.time;
                if (getBookedSlotsForDate(selectedDate).includes(t) || isPastSlot(selectedDate,t)) { updateUIForSelectedDate(); return; }

    function hasAppointmentWithinWeek(phone) {
        const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate()+1); tomorrow.setHours(0,0,0,0);
        const weekLater = new Date(tomorrow); weekLater.setDate(weekLater.getDate()+7);
        for (const [dateKey, apps] of Object.entries(appointments)) {
            const [y,m,d] = dateKey.split('-').map(Number);
            const date = new Date(y,m-1,d);
            if (date >= tomorrow && date <= weekLater) {
                for (const app of apps) if (app.phone === phone) return app;
            }
        }
        return null;
    }

    function buildArchiveMonths(year) {
        const monthsWithApps = new Set();
        Object.keys(filteredAppointments).forEach(dk => {

            if (y === year) monthsWithApps.add(parseInt(m));
        });
        const container = document.getElementById('archiveMonths');
        container.innerHTML = '';
        for (let m = 1; m <= 12; m++) {
            const card = document.createElement('div');
            card.className = 'archive-month-card' + (monthsWithApps.has(m) ? ' has-records' : '');
            card.innerHTML = `<div>${monthNames[m-1]}</div><small style="color:${monthsWithApps.has(m)?'#ff7eb3':'#888'}">${monthsWithApps.has(m) ? 'есть записи' : 'нет записей'}</small>`;
            card.addEventListener('click', () => showArchiveCalendar(year, m));
            container.appendChild(card);
        }
        document.getElementById('archiveCalendar').innerHTML = '';
        document.getElementById('archiveDetail').innerHTML = '';
    }

    function renderAdminBookings() {

        const now = new Date();

            if (date >= now) {
                appointments[dateKey].forEach(app => {
                    allBookings.push({
                        ...app,
                        date: date,
                        dateKey: dateKey
                    });
                });
            }
        });

        if (allBookings.length === 0) {
            bookingsContainer.innerHTML = '<div style="color:#aaa; text-align:center; padding:30px;">Нет будущих записей</div>';
            return;
        }

        let html = '';
        allBookings
            .sort((a, b) => a.date - b.date)
            .forEach(app => {
                const dateStr = app.date.toLocaleDateString('ru-RU', {
                    day: 'numeric',
                    month: 'long',
                    weekday: 'short'
                });
                const endTime = `${parseInt(app.time) + 2}:00`;

                html += `
                <div style="background:rgba(255,255,255,0.05); padding:15px; border-radius:15px;
                            margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;
                            border-left: 3px solid #ff7eb3; transition: all 0.2s;"
                     onmouseover="this.style.background='rgba(255,126,179,0.1)'"
                     onmouseout="this.style.background='rgba(255,255,255,0.05)'">
                    <div style="flex:1;">
                        <div style="color:#ff7eb3; font-weight:600; margin-bottom:5px;">${dateStr}</div>
                        <div style="color:#ddd;">
                            <span style="background:rgba(255,126,179,0.2); padding:2px 10px; border-radius:10px;">
                                ${app.time} – ${endTime}
                            </span>
                        </div>
                        <div style="margin-top:8px; color:#eee;">
                            👤 ${app.name}
                            <span style="color:#aaa; margin-left:10px;">📱 ${app.phone}</span>
                        </div>
                        ${app.note ? `<div style="color:#aaa; margin-top:5px; font-style:italic;">📝 ${app.note}</div>` : ''}
                        ${app.designUrl ? `<a href="${app.designUrl}" target="_blank" style="color:#ff7eb3; display:inline-block; margin-top:5px;">📎 Посмотреть дизайн</a>` : ''}
                    </div>
                    <button class="delete-btn" data-docid="${app.docId}"
                            style="background:#e74c3c; color:white; border:none; border-radius:50%;
                                   width:35px; height:35px; font-size:1.2rem; cursor:pointer;
                                   transition: all 0.3s; flex-shrink:0; margin-left:15px;"
                            onmouseover="this.style.transform='scale(1.1)'"
                            onmouseout="this.style.transform='scale(1)'">✕</button>
                </div>`;
            });

        bookingsContainer.innerHTML = html;

        // Обработчики удаления с модальным подтверждением
        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                const docId = this.dataset.docid;
                const confirmModal = document.createElement('div');
                confirmModal.className = 'modal active';
                confirmModal.innerHTML = `
                    <div class="modal-content" style="max-width:350px;">
                        <h3 style="color:#ff7eb3;">Подтверждение</h3>
                        <p style="color:#ddd; margin:20px 0;">Вы действительно хотите удалить эту запись?</p>
                        <div style="display:flex; gap:10px; justify-content:flex-end;">
                            <button class="modal-btn btn-secondary cancel-delete">Отмена</button>
                            <button class="modal-btn btn-primary confirm-delete">Удалить</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(confirmModal);

                confirmModal.querySelector('.confirm-delete').addEventListener('click', async () => {
                    await db.collection('appointments').doc(docId).delete();
                    confirmModal.remove();
                });

                confirmModal.querySelector('.cancel-delete').addEventListener('click', () => {
                    confirmModal.remove();
                });
            });
        });
    }

    // Обновление выходных дней
    db.collection('daysOff').onSnapshot(snap => {
        daysOff = snap.docs.map(d => d.id);
        updateMasterPanelButtons();
    });

    // Обновление записей в реальном времени
    db.collection('appointments').onSnapshot(snap => {
        appointments = {};
        snap.forEach(doc => {
            const data = doc.data();
            const dateKey = doc.id.split('_')[0];
            if (!appointments[dateKey]) appointments[dateKey] = [];
            appointments[dateKey].push({ ...data, docId: doc.id });
        });
        renderAll();
        if (isAdmin) renderAdminBookings();
    });

    // ========== НАВИГАЦИЯ ПО МЕСЯЦАМ ==========
    document.getElementById('prevMonth').addEventListener('click', () => {
        currentMonth--;
        if (currentMonth < 0) {
            currentMonth = 11;
            currentYear--;
        }
        selectedDate = null;
        selectedTime = null;
        multiSelectMode = false;
        selectedDaysSet.clear();
        renderAll();
    });

    document.getElementById('nextMonth').addEventListener('click', () => {
        currentMonth++;
        if (currentMonth > 11) {
            currentMonth = 0;
            currentYear++;
        }
        selectedDate = null;
        selectedTime = null;
        multiSelectMode = false;
        selectedDaysSet.clear();
        renderAll();
    });
</script>
</body>
</html>
