    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffeef8 0%, #ffd9e6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 750px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            box-shadow: 0 30px 50px rgba(200, 90, 120, 0.2), 0 10px 20px rgba(200, 90, 120, 0.1);
            padding: 25px 20px;
            position: relative;
        }

        /* Шапка с кнопками */
        .auth-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .auth-status {
            background: #fff0f5;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 500;
            color: #b3436e;
            box-shadow: 0 4px 8px rgba(180, 70, 110, 0.1);
            font-size: 0.9rem;
        }

        .auth-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .auth-btn {
            background: #e36b8c;
            border: none;
            color: white;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .auth-btn:hover {
            background: #c94b6e;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            color: #b3436e;
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #a05d7a;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        /* Панель мастера (выходные) */
        .master-toolbar {
            display: none;
            background: #fff0f5;
            border-radius: 20px;
            padding: 10px 15px;
            margin-bottom: 15px;
            box-shadow: 0 6px 14px rgba(180, 70, 110, 0.1);
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .master-toolbar.visible {
            display: flex;
        }

        .toggle-dayoff-btn,
        .multi-select-btn,
        .apply-multi-btn {
            background: white;
            border: 1.5px solid #e36b8c;
            color: #e36b8c;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .toggle-dayoff-btn:hover,
        .multi-select-btn:hover,
        .apply-multi-btn:hover {
            background: #e36b8c;
            color: white;
        }

        .selected-date-info {
            background: #fff0f5;
            border-radius: 20px;
            padding: 12px 16px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #5c2d43;
            font-weight: 500;
            box-shadow: 0 6px 14px rgba(180, 70, 110, 0.1);
        }

        /* Календарь */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .month-year {
            font-size: 1.3rem;
            font-weight: 600;
            color: #5c2d43;
            background: #fff0f5;
            padding: 8px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 8px rgba(180, 70, 110, 0.1);
        }

        .nav-btn {
            background: white;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 1.3rem;
            color: #b3436e;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(180, 70, 110, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-btn:hover {
            background: #ffe0ea;
            transform: scale(1.05);
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 600;
            color: #b3436e;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-bottom: 20px;
        }

        .day-cell {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border-radius: 14px;
            font-weight: 500;
            font-size: 0.95rem;
            color: #4a2c3a;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.03);
            position: relative;
            transition: all 0.2s;
        }

        .day-cell:hover:not(.day-off) {
            background: #ffe0ea;
        }

        .day-cell.today {
            border: 2px solid #e36b8c;
            font-weight: 700;
            color: #b3436e;
        }

        .day-cell.selected {
            background: #e36b8c;
            color: white;
            font-weight: 600;
            box-shadow: 0 8px 18px rgba(227, 107, 140, 0.5);
        }

        .day-cell.selected-multi {
            background: #f9c2d2;
            color: #5c2d43;
            font-weight: 600;
            box-shadow: 0 4px 8px rgba(227, 107, 140, 0.3);
            border: 2px solid #e36b8c;
        }

        .day-cell.other-month {
            color: #d4bcc7;
            background: #fdf4f8;
            cursor: default;
            pointer-events: none;
            opacity: 0.6;
        }

        .day-cell.day-off {
            background: #f9eaf0;
            color: #b1949f;
            cursor: default;
            text-decoration: line-through;
            pointer-events: auto;
        }

        .day-cell.day-off::after {
            content: 'вых.';
            position: absolute;
            bottom: 2px;
            font-size: 0.6rem;
            color: #b3436e;
            background: rgba(255,255,255,0.8);
            border-radius: 8px;
            padding: 0 3px;
        }

        .day-cell.has-appointments::before {
            content: '';
            position: absolute;
            bottom: 4px;
            width: 6px;
            height: 6px;
            background: #e36b8c;
            border-radius: 50%;
        }

        .time-slots {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 10px 0;
        }

        .time-slot {
            padding: 10px 16px;
            background: white;
            border: 1.5px solid #f0d3e0;
            border-radius: 30px;
            font-size: 0.9rem;
            color: #4a2c3a;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.02);
            font-weight: 500;
            text-align: center;
        }

        .time-slot small {
            display: block;
            font-size: 0.7rem;
            color: #9c5d7a;
        }

        .time-slot:hover:not(.booked):not(.unavailable) {
            background: #ffe0ea;
            border-color: #e36b8c;
        }

        .time-slot.selected-time {
            background: #e36b8c;
            border-color: #e36b8c;
            color: white;
            font-weight: 600;
            box-shadow: 0 6px 14px rgba(227, 107, 140, 0.4);
        }
        .time-slot.selected-time small {
            color: white;
        }

        .time-slot.booked,
        .time-slot.unavailable {
            background: #f5f5f5;
            color: #b3a1a8;
            border-color: #e0d4d8;
            cursor: not-allowed;
            text-decoration: line-through;
        }

        .past-message {
            color: #b3436e;
            font-weight: 500;
            margin: 10px 0;
            text-align: center;
        }

        .booking-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 10px 20px rgba(180, 70, 110, 0.1);
        }

        .booking-form input {
            padding: 12px 16px;
            border: 1.5px solid #f0d3e0;
            border-radius: 30px;
            font-size: 1rem;
            outline: none;
            background: white;
        }

        .booking-form input:focus {
            border-color: #e36b8c;
            box-shadow: 0 0 0 3px rgba(227, 107, 140, 0.2);
        }

        .book-btn {
            background: linear-gradient(135deg, #e36b8c, #c94b6e);
            border: none;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            padding: 14px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(201, 75, 110, 0.4);
        }

        .book-btn:disabled {
            background: #d4bcc7;
            box-shadow: none;
            cursor: not-allowed;
        }

        .admin-bookings {
            margin-top: 25px;
            background: #fff0f5;
            border-radius: 20px;
            padding: 20px;
        }

        .admin-bookings h2 {
            font-size: 1.2rem;
            color: #b3436e;
            margin-bottom: 12px;
        }

        .booking-item {
            background: white;
            border-radius: 16px;
            padding: 12px 16px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .booking-item button {
            background: none;
            border: none;
            color: #c94b6e;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .no-selection-message {
            color: #a07d8b;
            text-align: center;
            margin: 10px 0;
        }

        @media (max-width: 480px) {
            .app-container {
                padding: 20px 15px;
            }
            .auth-panel {
                flex-direction: column;
                align-items: flex-start;
            }
            .day-cell {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Шапка -->
        <div class="auth-panel">
            <span class="auth-status" id="authStatus">👤 Гость</span>
            <div class="auth-buttons">
                <button class="auth-btn" id="loginBtn">Войти как мастер</button>
                <button class="auth-btn" id="myBookingsBtn">📋 Мои записи</button>
            </div>
        </div>

        <h1>💅 Маникюр</h1>
        <div class="subtitle">Запись на двухчасовые сеансы</div>

        <!-- Панель мастера (выходные) -->
        <div class="master-toolbar" id="masterToolbar">
            <button class="toggle-dayoff-btn" id="toggleDayOffBtn" style="display: none;">Сделать выходным</button>
            <button class="multi-select-btn" id="multiSelectBtn">✎ Выбрать несколько</button>
            <button class="apply-multi-btn" id="applyMultiBtn" style="display: none;">Применить ко всем</button>
        </div>

        <!-- Календарь -->
        <div class="calendar-header">
            <button class="nav-btn" id="prevMonth">◀</button>
            <span class="month-year" id="monthYear"></span>
            <button class="nav-btn" id="nextMonth">▶</button>
        </div>

        <div class="weekdays">
            <span>Вс</span><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span>
        </div>
        <div class="days-grid" id="daysGrid"></div>

        <div class="selected-date-info" id="selectedDateDisplay">
            <span>📅 Дата не выбрана</span>
        </div>

        <div id="timeSelectionArea" style="display: none;">
            <div style="font-weight: 600; color: #5c2d43; margin-bottom: 5px;">Доступное время (2 часа):</div>
            <div class="time-slots" id="timeSlotsContainer"></div>
        </div>

        <div id="bookingFormArea" style="display: none;" class="booking-form">
            <input type="text" id="clientName" placeholder="Ваше имя" required>
            <input type="tel" id="clientPhone" placeholder="Телефон (в формате +7...)" required>
            <button class="book-btn" id="bookBtn">Записаться</button>
        </div>

        <div class="admin-bookings" id="adminBookings" style="display: none;">
            <h2>📋 Все записи (видны только мастеру)</h2>
            <div id="bookingsContainer"></div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        // ========== КОНФИГУРАЦИЯ FIREBASE (ЗАМЕНИТЕ НА СВОЮ) ==========
        const firebaseConfig = {
            apiKey: "AIzaSyCetvGM77zUc_Llh5p-FLTF6PkvH-lCPQ8",
            authDomain: "manik-56a31.firebaseapp.com",
            projectId: "manik-56a31",
            storageBucket: "manik-56a31.firebasestorage.app",
            messagingSenderId: "540265958043",
            appId: "1:540265958043:web:f3dd0d7ee6b9c9ffbe543e",
        };
        // =============================================================

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        db.enablePersistence().catch((err) => {
            if (err.code === 'failed-precondition') console.warn('Офлайн-режим не поддерживается');
        });

        // ---------- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ----------
        const MASTER_EMAIL = 'anime.tian.top@gmail.com'; // ← укажите email мастера
        const today = new Date();
        let currentMonth = today.getMonth();
        let currentYear = today.getFullYear();
        let selectedDate = null;
        let selectedTime = null;
        let isAdmin = false;
        let multiSelectMode = false;
        let selectedDaysSet = new Set();

        let appointments = {};
        let daysOff = [];

        const allTimeSlots = ['08:00', '10:00', '12:00', '14:00', '16:00', '18:00'];

        // ---------- DOM-ЭЛЕМЕНТЫ ----------
        const monthYearEl = document.getElementById('monthYear');
        const daysGridEl = document.getElementById('daysGrid');
        const selectedDateDisplay = document.getElementById('selectedDateDisplay');
        const masterToolbar = document.getElementById('masterToolbar');
        const toggleDayOffBtn = document.getElementById('toggleDayOffBtn');
        const multiSelectBtn = document.getElementById('multiSelectBtn');
        const applyMultiBtn = document.getElementById('applyMultiBtn');
        const timeSelectionArea = document.getElementById('timeSelectionArea');
        const timeSlotsContainer = document.getElementById('timeSlotsContainer');
        const bookingFormArea = document.getElementById('bookingFormArea');
        const bookBtn = document.getElementById('bookBtn');
        const clientNameInput = document.getElementById('clientName');
        const clientPhoneInput = document.getElementById('clientPhone');
        const adminBookings = document.getElementById('adminBookings');
        const bookingsContainer = document.getElementById('bookingsContainer');
        const authStatus = document.getElementById('authStatus');
        const loginBtn = document.getElementById('loginBtn');
        const myBookingsBtn = document.getElementById('myBookingsBtn');

        const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь',
            'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];

        // ---------- АУТЕНТИФИКАЦИЯ ----------
        auth.onAuthStateChanged((user) => {
            if (user) {
                isAdmin = (user.email === MASTER_EMAIL);
                if (isAdmin) {
                    authStatus.textContent = '🔑 Мастер';
                    loginBtn.textContent = 'Выйти';
                } else {
                    authStatus.textContent = '👤 Клиент';
                    loginBtn.textContent = 'Войти как мастер';
                }
            } else {
                auth.signInAnonymously().catch(console.error);
                isAdmin = false;
                authStatus.textContent = '👤 Гость';
                loginBtn.textContent = 'Войти как мастер';
            }
            multiSelectMode = false;
            selectedDaysSet.clear();
            updateUIForRole();
            loadDataFromFirestore();
        });

        loginBtn.addEventListener('click', () => {
            if (isAdmin) {
                auth.signOut();
            } else {
                const email = prompt('Email мастера:');
                const password = prompt('Пароль:');
                if (email && password) {
                    auth.signInWithEmailAndPassword(email, password)
                        .catch((error) => alert('Ошибка входа: ' + error.message));
                }
            }
        });

        // ---------- ПРОСМОТР ЗАПИСЕЙ КЛИЕНТА ----------
        myBookingsBtn.addEventListener('click', () => {
            const phone = prompt('Введите ваш номер телефона (как при записи):');
            if (!phone) return;
            const phoneClean = phone.trim();
            const now = new Date();
            now.setHours(0,0,0,0);
            let found = [];
            Object.keys(appointments).forEach(dateKey => {
                const [y, m, d] = dateKey.split('-').map(Number);
                const date = new Date(y, m-1, d);
                if (date < now) return;
                const apps = appointments[dateKey];
                apps.forEach(app => {
                    if (app.phone === phoneClean) found.push({ dateKey, ...app });
                });
            });
            if (found.length === 0) {
                alert('Записей с таким номером не найдено.');
                return;
            }
            let message = '📅 Ваши записи:\n\n';
            found.forEach((app, i) => {
                const d = new Date(app.dateKey);
                const dateStr = d.toLocaleDateString('ru-RU', { day:'numeric', month:'long', weekday:'short' });
                const [h] = app.time.split(':').map(Number);
                const endTime = `${String(h+2).padStart(2,'0')}:00`;
                message += `${i+1}. ${dateStr} ${app.time}-${endTime}\n   Имя: ${app.name}\n\n`;
            });
            alert(message);
        });

        // ---------- ЗАГРУЗКА ДАННЫХ ----------
        function loadDataFromFirestore() {
            db.collection('daysOff').get().then((snapshot) => {
                daysOff = snapshot.docs.map(doc => doc.id);
                return db.collection('appointments').get();
            }).then((snapshot) => {
                appointments = {};
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const dateKey = doc.id.split('_')[0];
                    if (!appointments[dateKey]) appointments[dateKey] = [];
                    appointments[dateKey].push({
                        time: data.time,
                        name: data.name,
                        phone: data.phone,
                        docId: doc.id
                    });
                });
                renderAll();
            }).catch(console.error);
        }

        function subscribeToUpdates() {
            db.collection('appointments').onSnapshot((snapshot) => {
                appointments = {};
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const dateKey = doc.id.split('_')[0];
                    if (!appointments[dateKey]) appointments[dateKey] = [];
                    appointments[dateKey].push({
                        time: data.time,
                        name: data.name,
                        phone: data.phone,
                        docId: doc.id
                    });
                });
                renderAll();
            });
            db.collection('daysOff').onSnapshot((snapshot) => {
                daysOff = snapshot.docs.map(doc => doc.id);
                renderAll();
            });
        }

        function addAppointment(dateKey, time, name, phone) {
            const docId = `${dateKey}_${time}`;
            return db.collection('appointments').doc(docId).set({ time, name, phone });
        }

        function deleteAppointment(docId) {
            return db.collection('appointments').doc(docId).delete();
        }

        function setDayOff(dateKey, isOff) {
            if (isOff) {
                return db.collection('daysOff').doc(dateKey).set({});
            } else {
                return db.collection('daysOff').doc(dateKey).delete();
            }
        }

        // ---------- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ----------
        function formatDateKey(date) {
            return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
        }

        function isToday(date) {
            const t = new Date();
            return date.getFullYear() === t.getFullYear() &&
                   date.getMonth() === t.getMonth() &&
                   date.getDate() === t.getDate();
        }

        function isDayOff(dateKey) {
            return daysOff.includes(dateKey);
        }

        function getBookedSlotsForDate(date) {
            const key = formatDateKey(date);
            return appointments[key] ? appointments[key].map(a => a.time) : [];
        }

        function isPastSlot(date, timeStr) {
            if (!isToday(date)) return false;
            const now = new Date();
            const [h, m] = timeStr.split(':').map(Number);
            const slotEnd = new Date(date.getFullYear(), date.getMonth(), date.getDate(), h + 2, m, 0);
            return slotEnd <= now;
        }

        // Функция проверки, что дата не раньше завтрашнего дня
        function isDateInPast(date) {
            // Завтра, 00:00:00
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            tomorrow.setHours(0, 0, 0, 0);
            // Выбранная дата без времени
            const dateOnly = new Date(date.getFullYear(), date.getMonth(), date.getDate());
            return dateOnly < tomorrow;
        }

        function renderAll() {
            renderCalendar();
            updateMasterToolbar();
            if (selectedDate) updateUIForSelectedDate();
            renderAdminBookings();
        }

        // ---------- КАЛЕНДАРЬ ----------
        function renderCalendar() {
            monthYearEl.textContent = `${monthNames[currentMonth]} ${currentYear}`;
            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const daysInPrevMonth = new Date(currentYear, currentMonth, 0).getDate();

            let html = '';
            for (let i = firstDay - 1; i >= 0; i--) {
                html += `<div class="day-cell other-month">${daysInPrevMonth - i}</div>`;
            }
            for (let d = 1; d <= daysInMonth; d++) {
                const date = new Date(currentYear, currentMonth, d);
                const dateKey = formatDateKey(date);
                const isOff = isDayOff(dateKey);
                const hasApps = appointments[dateKey] && appointments[dateKey].length > 0;
                let classes = 'day-cell';
                if (isToday(date)) classes += ' today';
                if (selectedDate && !multiSelectMode && formatDateKey(selectedDate) === dateKey) classes += ' selected';
                if (multiSelectMode && selectedDaysSet.has(dateKey)) classes += ' selected-multi';
                if (isOff) classes += ' day-off';
                if (hasApps && !isOff) classes += ' has-appointments';
                html += `<div class="${classes}" data-date="${dateKey}">${d}</div>`;
            }
            const totalCells = firstDay + daysInMonth;
            const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
            for (let d = 1; d <= remaining; d++) {
                html += `<div class="day-cell other-month">${d}</div>`;
            }
            daysGridEl.innerHTML = html;

            document.querySelectorAll('.day-cell[data-date]').forEach(cell => {
                cell.addEventListener('click', function(e) {
                    const dateKey = this.dataset.date;
                    if (multiSelectMode && isAdmin) {
                        if (selectedDaysSet.has(dateKey)) {
                            selectedDaysSet.delete(dateKey);
                        } else {
                            selectedDaysSet.add(dateKey);
                        }
                        renderCalendar();
                        updateMasterToolbar();
                        return;
                    }
                    const [y, m, d] = dateKey.split('-').map(Number);
                    selectedDate = new Date(y, m - 1, d);
                    selectedTime = null;
                    updateUIForSelectedDate();
                    renderCalendar();
                    updateMasterToolbar();
                });
            });
        }

        // ---------- ПАНЕЛЬ ИНСТРУМЕНТОВ МАСТЕРА ----------
        function updateMasterToolbar() {
            if (!isAdmin) {
                masterToolbar.classList.remove('visible');
                return;
            }
            masterToolbar.classList.add('visible');

            // Кнопка одиночного выходного
            if (selectedDate && !multiSelectMode) {
                const dateKey = formatDateKey(selectedDate);
                toggleDayOffBtn.style.display = 'inline-block';
                toggleDayOffBtn.textContent = isDayOff(dateKey) ? 'Сделать рабочим' : 'Сделать выходным';
            } else {
                toggleDayOffBtn.style.display = 'none';
            }

            // Кнопка мультивыбора
            multiSelectBtn.textContent = multiSelectMode ? 'Завершить выбор' : '✎ Выбрать несколько';

            // Кнопка применения для мультивыбора
            if (multiSelectMode && selectedDaysSet.size > 0) {
                applyMultiBtn.style.display = 'inline-block';
            } else {
                applyMultiBtn.style.display = 'none';
            }
        }

        // Обработчики для панели мастера
        toggleDayOffBtn.addEventListener('click', () => {
            if (!selectedDate) return;
            const dateKey = formatDateKey(selectedDate);
            setDayOff(dateKey, !isDayOff(dateKey));
        });

        multiSelectBtn.addEventListener('click', () => {
            multiSelectMode = !multiSelectMode;
            if (!multiSelectMode) {
                selectedDaysSet.clear();
            }
            selectedDate = null;
            selectedTime = null;
            timeSelectionArea.style.display = 'none';
            bookingFormArea.style.display = 'none';
            renderCalendar();
            updateMasterToolbar();
            updateUIForSelectedDate();
        });

        applyMultiBtn.addEventListener('click', () => {
            selectedDaysSet.forEach(dateKey => {
                if (!isDayOff(dateKey)) {
                    setDayOff(dateKey, true);
                }
            });
            selectedDaysSet.clear();
            multiSelectMode = false;
            renderCalendar();
            updateMasterToolbar();
            updateUIForSelectedDate();
        });

        // ---------- ОБНОВЛЕНИЕ ВЫБРАННОЙ ДАТЫ ----------
        function updateUIForSelectedDate() {
            if (!selectedDate || multiSelectMode) {
                selectedDateDisplay.innerHTML = '<span>📅 Дата не выбрана</span>';
                timeSelectionArea.style.display = 'none';
                bookingFormArea.style.display = 'none';
                return;
            }

            const dateKey = formatDateKey(selectedDate);
            const options = { weekday: 'long', day: 'numeric', month: 'long' };
            const formatted = selectedDate.toLocaleDateString('ru-RU', options);
            selectedDateDisplay.innerHTML = `<span>📅 ${formatted}</span>`;

            // Проверка на прошлое (нельзя записаться на сегодня и раньше)
            if (isDateInPast(selectedDate)) {
                timeSelectionArea.innerHTML = '<div class="past-message">⛔ Запись возможна только начиная с завтрашнего дня</div>';
                timeSelectionArea.style.display = 'block';
                bookingFormArea.style.display = 'none';
                return;
            }

            const isOff = isDayOff(dateKey);
            if (isOff) {
                timeSelectionArea.style.display = 'none';
                bookingFormArea.style.display = 'none';
                return;
            }

            const bookedSlots = getBookedSlotsForDate(selectedDate);
            let slotsHtml = '';
            allTimeSlots.forEach(time => {
                const [h, m] = time.split(':').map(Number);
                const endTime = `${String(h+2).padStart(2,'0')}:${m}`;
                const isBooked = bookedSlots.includes(time);
                const past = isPastSlot(selectedDate, time);
                let slotClass = 'time-slot';
                if (isBooked) slotClass += ' booked';
                else if (past) slotClass += ' unavailable';
                if (selectedTime === time && !isBooked && !past) slotClass += ' selected-time';
                slotsHtml += `<div class="${slotClass}" data-time="${time}">${time}<small>до ${endTime}</small></div>`;
            });

            timeSlotsContainer.innerHTML = slotsHtml;
            timeSelectionArea.style.display = 'block';

            if (selectedTime && (bookedSlots.includes(selectedTime) || isPastSlot(selectedDate, selectedTime))) {
                selectedTime = null;
            }
            bookingFormArea.style.display = selectedTime ? 'flex' : 'none';

            document.querySelectorAll('.time-slot:not(.booked):not(.unavailable)').forEach(slot => {
                if (slot) {
                    slot.addEventListener('click', function() {
                        const time = this.dataset.time;
                        const currentBooked = getBookedSlotsForDate(selectedDate);
                        if (currentBooked.includes(time) || isPastSlot(selectedDate, time)) {
                            updateUIForSelectedDate();
                            return;
                        }
                        selectedTime = time;
                        updateUIForSelectedDate();
                    });
                }
            });
        }

        // ---------- ЗАПИСЬ КЛИЕНТА ----------
        bookBtn.addEventListener('click', async () => {
            if (!selectedDate || !selectedTime) return;
            const dateKey = formatDateKey(selectedDate);
            if (isDateInPast(selectedDate)) {
                alert('Нельзя записаться на прошедший день. Выберите завтра или позже.');
                return;
            }
            if (isDayOff(dateKey)) {
                alert('Этот день выходной. Выберите другой.');
                return;
            }
            const name = clientNameInput.value.trim();
            const phone = clientPhoneInput.value.trim();
            if (!name || !phone) {
                alert('Введите имя и телефон.');
                return;
            }
            try {
                await addAppointment(dateKey, selectedTime, name, phone);
                clientNameInput.value = '';
                clientPhoneInput.value = '';
                selectedTime = null;
                updateUIForSelectedDate();
                alert('✅ Вы записаны!');
                // Показать все записи клиента
                const clientApps = [];
                Object.keys(appointments).forEach(dk => {
                    const apps = appointments[dk];
                    apps.forEach(app => {
                        if (app.phone === phone) clientApps.push({ dateKey: dk, ...app });
                    });
                });
                if (clientApps.length > 0) {
                    let msg = '📋 Все ваши записи:\n\n';
                    clientApps.forEach((app, i) => {
                        const d = new Date(app.dateKey);
                        const dateStr = d.toLocaleDateString('ru-RU', { day:'numeric', month:'long', weekday:'short' });
                        const [h] = app.time.split(':').map(Number);
                        msg += `${i+1}. ${dateStr} ${app.time}-${String(h+2).padStart(2,'0')}:00\n   Имя: ${app.name}\n\n`;
                    });
                    alert(msg);
                }
            } catch (error) {
                alert('Ошибка записи: ' + error.message);
            }
        });

        // ---------- АДМИН-ПАНЕЛЬ ----------
        function renderAdminBookings() {
            if (!isAdmin) {
                adminBookings.style.display = 'none';
                return;
            }
            adminBookings.style.display = 'block';
            const now = new Date();
            now.setHours(0,0,0,0);
            let itemsHtml = '';
            const sortedKeys = Object.keys(appointments).sort();
            let hasAny = false;

            sortedKeys.forEach(dateKey => {
                const [y, m, d] = dateKey.split('-').map(Number);
                const date = new Date(y, m-1, d);
                if (date < now) return;
                const apps = appointments[dateKey];
                apps.forEach((app) => {
                    hasAny = true;
                    const [h] = app.time.split(':').map(Number);
                    const endTime = `${String(h+2).padStart(2,'0')}:00`;
                    const formattedDate = date.toLocaleDateString('ru-RU', { day:'numeric', month:'long', weekday:'short' });
                    itemsHtml += `
                        <div class="booking-item">
                            <div>
                                <strong>${formattedDate}</strong> ${app.time}-${endTime}<br>
                                <small>${app.name} — ${app.phone}</small>
                            </div>
                            <button data-docid="${app.docId}">✕ Удалить</button>
                        </div>
                    `;
                });
            });

            if (!hasAny) {
                itemsHtml = '<div class="no-selection-message">Нет будущих записей</div>';
            }
            bookingsContainer.innerHTML = itemsHtml;

            document.querySelectorAll('.booking-item button').forEach(btn => {
                if (btn) {
                    btn.addEventListener('click', function(e) {
                        const docId = this.dataset.docid;
                        if (confirm('Удалить эту запись?')) {
                            deleteAppointment(docId);
                        }
                    });
                }
            });
        }

        // ---------- НАВИГАЦИЯ ----------
        document.getElementById('prevMonth').addEventListener('click', () => {
            currentMonth--;
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            resetSelection();
            renderAll();
        });

        document.getElementById('nextMonth').addEventListener('click', () => {
            currentMonth++;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            resetSelection();
            renderAll();
        });

        function resetSelection() {
            selectedDate = null;
            selectedTime = null;
            multiSelectMode = false;
            selectedDaysSet.clear();
            timeSelectionArea.style.display = 'none';
            bookingFormArea.style.display = 'none';
            updateMasterToolbar();
        }

        function updateUIForRole() {
            adminBookings.style.display = isAdmin ? 'block' : 'none';
            if (!isAdmin) {
                multiSelectMode = false;
                selectedDaysSet.clear();
            }
            updateMasterToolbar();
            if (selectedDate) updateUIForSelectedDate();
            else {
                timeSelectionArea.style.display = 'none';
                bookingFormArea.style.display = 'none';
            }
        }

        // ---------- ЗАПУСК ----------
        subscribeToUpdates();
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registered'))
                    .catch(err => console.log('SW error', err));
            });
        }
    </script>
</body>
