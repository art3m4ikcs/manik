.archive-content .days-grid {

}

}

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
    // ========== КОНФИГУРАЦИЯ ==========
    const firebaseConfig = {
        apiKey: "AIzaSyCetvGM77zUc_Llh5p-FLTF6PkvH-lCPQ8",
        authDomain: "manik-56a31.firebaseapp.com",
        projectId: "manik-56a31",
        storageBucket: "manik-56a31.firebasestorage.app",
        messagingSenderId: "540265958043",
        appId: "1:540265958043:web:f3dd0d7ee6b9c9ffbe543e",
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    db.enablePersistence().catch(() => {});

    const MASTER_EMAIL = 'anime.tian.top@gmail.com';
    const today = new Date();
    let currentMonth = today.getMonth();
    let currentYear = today.getFullYear();
    let selectedDate = null;
    let selectedTime = null;
    let isAdmin = false;
    let multiSelectMode = false;
    let selectedDaysSet = new Set();
    let appointments = {};
    let daysOff = [];
    const allTimeSlots = ['08:00','10:00','12:00','14:00','16:00','18:00'];

    // DOM основного экрана
    const monthYearEl = document.getElementById('monthYear');
    const daysGridEl = document.getElementById('daysGrid');
    const selectedDateDisplay = document.getElementById('selectedDateDisplay');
    const masterToolbar = document.getElementById('masterToolbar');
    const toggleDayOffBtn = document.getElementById('toggleDayOffBtn');
    const multiSelectBtn = document.getElementById('multiSelectBtn');
    const applyMultiBtn = document.getElementById('applyMultiBtn');
    const timeSelectionArea = document.getElementById('timeSelectionArea');
    let timeSlotsContainer = document.getElementById('timeSlotsContainer');
    const bookingFormArea = document.getElementById('bookingFormArea');
    const bookBtn = document.getElementById('bookBtn');
    const clientNameInput = document.getElementById('clientName');
    const clientPhoneInput = document.getElementById('clientPhone');
    const adminBookings = document.getElementById('adminBookings');
    const bookingsContainer = document.getElementById('bookingsContainer');
    const authStatus = document.getElementById('authStatus');
    const loginBtn = document.getElementById('loginBtn');
    const myBookingsBtn = document.getElementById('myBookingsBtn');

    // Страницы
    const mainPage = document.getElementById('mainPage');
    const archivePage = document.getElementById('archivePage');

    const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь',
        'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

    // Аутентификация
    auth.onAuthStateChanged((user) => {
        if (user) {
            isAdmin = (user.email === MASTER_EMAIL);
            authStatus.textContent = isAdmin ? ' Мастер' : ' Клиент';
            loginBtn.textContent = isAdmin ? 'Выйти' : 'Войти как мастер';
        } else {
            auth.signInAnonymously().catch(console.error);
            isAdmin = false;
            authStatus.textContent = ' Гость';
            loginBtn.textContent = 'Войти как мастер';
        }
        multiSelectMode = false;
        selectedDaysSet.clear();
        updateUIForRole();
        loadDataFromFirestore();
    });

    loginBtn.addEventListener('click', () => {
        if (isAdmin) { auth.signOut(); }
        else {
            const email = prompt('Email мастера:');
            const password = prompt('Пароль:');
            if (email && password) auth.signInWithEmailAndPassword(email, password).catch(err => alert('Ошибка входа: ' + err.message));
        }
    });

    myBookingsBtn.addEventListener('click', () => {
        const phone = prompt('Введите ваш номер телефона:');
        if (!phone) return;
        const now = new Date(); now.setHours(0,0,0,0);
        const found = [];
        Object.entries(appointments).forEach(([dateKey, apps]) => {
            const [y,m,d] = dateKey.split('-').map(Number);
            const date = new Date(y,m-1,d);
            if (date < now) return;
            apps.forEach(app => { if (app.phone === phone.trim()) found.push({...app, dateKey}); });
        });
        if (!found.length) alert('Записей не найдено.');
        else {
            let msg = ' Ваши записи:\n\n';
            found.forEach((app,i) => {
                const d = new Date(app.dateKey);
                msg += `${i+1}. ${d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'short'})} ${app.time}-${parseInt(app.time)+2}:00, ${app.name}\n`;
            });
            alert(msg);
        }
    });

    // Загрузка данных
    function loadDataFromFirestore() {
        db.collection('daysOff').get().then(snap => {
            daysOff = snap.docs.map(d => d.id);
            return db.collection('appointments').get();
        }).then(snap => {
            appointments = {};
            snap.forEach(doc => {
                const data = doc.data();
                const dateKey = doc.id.split('_')[0];
                if (!appointments[dateKey]) appointments[dateKey] = [];
                appointments[dateKey].push({...data, docId: doc.id});
            });
            renderAll();
        }).catch(console.error);
    }

    function subscribeToUpdates() {
        db.collection('appointments').onSnapshot(snap => {
            appointments = {};
            snap.forEach(doc => {
                const data = doc.data();
                const dateKey = doc.id.split('_')[0];
                if (!appointments[dateKey]) appointments[dateKey] = [];
                appointments[dateKey].push({...data, docId: doc.id});
            });
            if (mainPage.classList.contains('active')) renderAll();
        });
        db.collection('daysOff').onSnapshot(snap => {
            daysOff = snap.docs.map(d => d.id);
            if (mainPage.classList.contains('active')) renderAll();
        });
    }

    function addAppointment(dateKey, time, name, phone) {
        return db.collection('appointments').doc(`${dateKey}_${time}`).set({time, name, phone});
    }
    function deleteAppointment(docId) {
        return db.collection('appointments').doc(docId).delete();
    }
    function setDayOff(dateKey, isOff) {
        return isOff ? db.collection('daysOff').doc(dateKey).set({}) : db.collection('daysOff').doc(dateKey).delete();
    }

    // Вспомогательные функции (formatDateKey, isToday, isDayOff, getBookedSlotsForDate, isPastSlot, isDateInPast)
    function formatDateKey(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    function isToday(d) { const t=new Date(); return d.getFullYear()===t.getFullYear() && d.getMonth()===t.getMonth() && d.getDate()===t.getDate(); }
    function isDayOff(dk) { return daysOff.includes(dk); }
    function getBookedSlotsForDate(d) { const k=formatDateKey(d); return appointments[k] ? appointments[k].map(a=>a.time) : []; }
    function isPastSlot(d,time) { if(!isToday(d)) return false; const [h,m]=time.split(':').map(Number); const end=new Date(d.getFullYear(),d.getMonth(),d.getDate(),h+2,m); return end <= new Date(); }
    function isDateInPast(d) { const tomorrow=new Date(); tomorrow.setDate(tomorrow.getDate()+1); tomorrow.setHours(0,0,0,0); return new Date(d.getFullYear(),d.getMonth(),d.getDate()) < tomorrow; }

    function renderAll() {
        renderCalendar();
        updateMasterToolbar();
        if (selectedDate) updateUIForSelectedDate();
        renderAdminBookings();
    }

    // Календарь
    function renderCalendar() {
        monthYearEl.textContent = `${monthNames[currentMonth]} ${currentYear}`;
        const firstDay = new Date(currentYear, currentMonth, 1).getDay();
        const daysInMonth = new Date(currentYear, currentMonth+1, 0).getDate();
        const prevMonthDays = new Date(currentYear, currentMonth, 0).getDate();
        let html = '';
        for (let i = firstDay-1; i >= 0; i--) html += `<div class="day-cell other-month">${prevMonthDays - i}</div>`;
        for (let d=1; d<=daysInMonth; d++) {
            const date = new Date(currentYear, currentMonth, d);
            const dk = formatDateKey(date);
            let cls = 'day-cell';
            if (isToday(date)) cls += ' today';
            if (selectedDate && !multiSelectMode && formatDateKey(selectedDate)===dk) cls += ' selected';
            if (multiSelectMode && selectedDaysSet.has(dk)) cls += ' selected-multi';
            if (isDayOff(dk)) cls += ' day-off';
            if (appointments[dk]?.length) cls += ' has-appointments';
            html += `<div class="${cls}" data-date="${dk}">${d}</div>`;
        }
        const total = firstDay + daysInMonth;
        const rem = total%7 ? 7 - total%7 : 0;
        for (let d=1; d<=rem; d++) html += `<div class="day-cell other-month">${d}</div>`;
        daysGridEl.innerHTML = html;
        document.querySelectorAll('.day-cell[data-date]').forEach(cell => {
            cell.addEventListener('click', function() {
                const dk = this.dataset.date;
                if (multiSelectMode && isAdmin) {
                    selectedDaysSet.has(dk) ? selectedDaysSet.delete(dk) : selectedDaysSet.add(dk);
                    renderCalendar(); updateMasterToolbar(); return;
                }
                const [y,m,d] = dk.split('-').map(Number);
                selectedDate = new Date(y,m-1,d);
                selectedTime = null;
                updateUIForSelectedDate();
                renderCalendar();
                updateMasterToolbar();
            });
        });
    }

    function updateMasterToolbar() {
        if (!isAdmin) { masterToolbar.classList.remove('visible'); return; }
        masterToolbar.classList.add('visible');
        if (selectedDate && !multiSelectMode) {
            toggleDayOffBtn.style.display='inline-block';
            toggleDayOffBtn.textContent = isDayOff(formatDateKey(selectedDate)) ? 'Сделать рабочим' : 'Сделать выходным';
        } else toggleDayOffBtn.style.display='none';
        multiSelectBtn.textContent = multiSelectMode ? 'Завершить выбор' : '✎ Выбрать несколько';
        applyMultiBtn.style.display = (multiSelectMode && selectedDaysSet.size>0) ? 'inline-block' : 'none';
    }

    toggleDayOffBtn.addEventListener('click', () => {
        if (!selectedDate) return;
        setDayOff(formatDateKey(selectedDate), !isDayOff(formatDateKey(selectedDate)));
    });
    multiSelectBtn.addEventListener('click', () => {
        multiSelectMode = !multiSelectMode;
        if (!multiSelectMode) selectedDaysSet.clear();
        selectedDate = null; selectedTime = null;
        timeSelectionArea.style.display='none'; bookingFormArea.style.display='none';
        renderCalendar(); updateMasterToolbar(); updateUIForSelectedDate();
    });
    applyMultiBtn.addEventListener('click', () => {
        selectedDaysSet.forEach(dk => { if (!isDayOff(dk)) setDayOff(dk, true); });
        selectedDaysSet.clear(); multiSelectMode = false;
        renderCalendar(); updateMasterToolbar(); updateUIForSelectedDate();
    });

    function updateUIForSelectedDate() {
        if (!selectedDate || multiSelectMode) {
            selectedDateDisplay.innerHTML='<span> Дата не выбрана</span>';
            timeSelectionArea.style.display='none'; bookingFormArea.style.display='none';
            return;
        }
        const dk = formatDateKey(selectedDate);
        selectedDateDisplay.innerHTML=`<span> ${selectedDate.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}</span>`;
        timeSelectionArea.innerHTML = `<div style="font-weight:600;color:#5c2d43;margin-bottom:5px;">Доступное время (2 часа):</div><div class="time-slots" id="timeSlotsContainer"></div>`;
        timeSlotsContainer = document.getElementById('timeSlotsContainer');
        timeSelectionArea.style.display='block';
        if (isDateInPast(selectedDate)) {
            timeSelectionArea.innerHTML = '<div class="past-message"> Запись только с завтрашнего дня</div>';
            bookingFormArea.style.display='none'; return;
        }
        if (isDayOff(dk)) { timeSelectionArea.style.display='none'; bookingFormArea.style.display='none'; return; }
        const booked = getBookedSlotsForDate(selectedDate);
        let slotsHtml = '';
        allTimeSlots.forEach(time => {
            const end = `${parseInt(time)+2}:00`;
            const isB = booked.includes(time);
            const past = isPastSlot(selectedDate, time);
            let cls = 'time-slot';
            if (isB) cls+=' booked'; else if (past) cls+=' unavailable';
            if (selectedTime===time && !isB && !past) cls+=' selected-time';
            slotsHtml += `<div class="${cls}" data-time="${time}">${time}<small>до ${end}</small></div>`;
        });
        timeSlotsContainer.innerHTML = slotsHtml;
        if (selectedTime && (booked.includes(selectedTime) || isPastSlot(selectedDate,selectedTime))) selectedTime=null;
        bookingFormArea.style.display = selectedTime ? 'flex' : 'none';
        document.querySelectorAll('.time-slot:not(.booked):not(.unavailable)').forEach(s=>{
            s.addEventListener('click', function(){
                const t = this.dataset.time;
                if (getBookedSlotsForDate(selectedDate).includes(t) || isPastSlot(selectedDate,t)) { updateUIForSelectedDate(); return; }
                selectedTime = t; updateUIForSelectedDate();
            });
        });
    }

    bookBtn.addEventListener('click', async () => {
        if (!selectedDate || !selectedTime) return;
        const dk = formatDateKey(selectedDate);
        if (isDateInPast(selectedDate)) { alert('Нельзя записаться на прошедший день.'); return; }
        if (isDayOff(dk)) { alert('Выходной.'); return; }
        const name = clientNameInput.value.trim(), phone = clientPhoneInput.value.trim();
        if (!name || !phone) { alert('Введите имя и телефон.'); return; }
        try {
            await addAppointment(dk, selectedTime, name, phone);
            clientNameInput.value=''; clientPhoneInput.value=''; selectedTime=null;
            updateUIForSelectedDate(); alert(' Записаны!');
        } catch(e) { alert('Ошибка: '+e.message); }
    });

    function renderAdminBookings() {
        if (!isAdmin) { adminBookings.style.display='none'; return; }
        adminBookings.style.display='block';
        const now = new Date(); now.setHours(0,0,0,0);
        let items = '';
        Object.keys(appointments).sort().forEach(dk => {
            const [y,m,d] = dk.split('-').map(Number);
            const date = new Date(y,m-1,d);
            if (date < now) return;
            appointments[dk].forEach(app => {
                const end = `${parseInt(app.time)+2}:00`;
                items += `<div class="booking-item"><div><strong>${date.toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'short'})}</strong> ${app.time}-${end}<br><small>${app.name} — ${app.phone}</small></div><button data-docid="${app.docId}">✕ Удалить</button></div>`;
            });
        });
        bookingsContainer.innerHTML = items || '<div class="no-selection-message">Нет будущих записей</div>';
        document.querySelectorAll('.booking-item button').forEach(b => b.addEventListener('click', function() { if (confirm('Удалить?')) deleteAppointment(this.dataset.docid); }));
    }

    // Навигация по месяцам
    document.getElementById('prevMonth').addEventListener('click', ()=>{ currentMonth--; if(currentMonth<0){currentMonth=11;currentYear--;} resetSelection(); renderAll(); });
    document.getElementById('nextMonth').addEventListener('click', ()=>{ currentMonth++; if(currentMonth>11){currentMonth=0;currentYear++;} resetSelection(); renderAll(); });
    function resetSelection() { selectedDate=null; selectedTime=null; multiSelectMode=false; selectedDaysSet.clear(); timeSelectionArea.style.display='none'; bookingFormArea.style.display='none'; }

    function updateUIForRole() {
        adminBookings.style.display = isAdmin ? 'block' : 'none';
        if (!isAdmin) { multiSelectMode=false; selectedDaysSet.clear(); }
        updateMasterToolbar();
        if (selectedDate) updateUIForSelectedDate(); else { timeSelectionArea.style.display='none'; bookingFormArea.style.display='none'; }
    }

    // ===== АРХИВ =====
    const archiveBtn = document.getElementById('archiveBtn');
    const backFromArchive = document.getElementById('backFromArchive');
    const yearsSidebar = document.getElementById('yearsSidebar');
    const archiveContent = document.getElementById('archiveContent');
    let selectedArchiveYear = null, selectedArchiveMonth = null;

    function showArchive() {
        mainPage.classList.remove('active');
        archivePage.classList.add('active');
        buildYearsList();
    }

    function hideArchive() {
        archivePage.classList.remove('active');
        mainPage.classList.add('active');
        selectedArchiveYear = selectedArchiveMonth = null;
    }

    archiveBtn.addEventListener('click', showArchive);
    backFromArchive.addEventListener('click', hideArchive);

    function buildYearsList() {
        const years = new Set();
        Object.keys(appointments).forEach(dk => years.add(dk.split('-')[0]));
        if (years.size === 0) { yearsSidebar.innerHTML = '<small>Нет записей</small>'; archiveContent.innerHTML = ''; return; }
        const sorted = Array.from(years).sort((a,b)=>b-a);
        yearsSidebar.innerHTML = sorted.map(y => `<button data-year="${y}">${y}</button>`).join('');
        yearsSidebar.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function() {
                selectedArchiveYear = this.dataset.year;
                selectedArchiveMonth = null;
                buildMonthsList(selectedArchiveYear);
                yearsSidebar.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
            });
        });
        if (sorted.length) { yearsSidebar.querySelector('button').click(); }
    }

    function buildMonthsList(year) {
        const monthsWithApps = new Set();
        Object.keys(appointments).forEach(dk => {
            const [y,m] = dk.split('-');
            if (y === year) monthsWithApps.add(parseInt(m));
        });
        const allMonths = Array.from({length:12}, (_,i)=>i+1);
        archiveContent.innerHTML = allMonths.map(m => {
            const has = monthsWithApps.has(m);
            return `<div class="month-card" data-month="${m}">${monthNames[m-1]}<br><small>${has ? 'есть записи' : 'нет записей'}</small></div>`;
        }).join('');
        archiveContent.querySelectorAll('.month-card').forEach(card => {
            card.addEventListener('click', function() {
                selectedArchiveMonth = parseInt(this.dataset.month);
                showCalendarForMonth(selectedArchiveYear, selectedArchiveMonth);
            });
        });
    }

    function showCalendarForMonth(year, month) {
    archiveContent.innerHTML = `<button class="back-btn" id="backToMonths">← К месяцам</button>`;
    const calDiv = document.createElement('div');
    calDiv.className = 'days-grid';
    const firstDay = new Date(year, month-1, 1).getDay();
    const daysInMonth = new Date(year, month, 0).getDate();
    let html = '';
    for (let i=0; i<firstDay; i++) html += '<div class="day-cell other-month"></div>';
    for (let d=1; d<=daysInMonth; d++) {
        const date = new Date(year, month-1, d);
        const dk = formatDateKey(date);
        const apps = appointments[dk] || [];
        let cls = 'day-cell';
        if (apps.length) cls += ' has-appointments';
        html += `<div class="${cls}" data-date="${dk}">${d}</div>`;
    }
    calDiv.innerHTML = html;
    archiveContent.appendChild(calDiv);

    // Блок для отображения записей выбранного дня
    const detailDiv = document.createElement('div');
    detailDiv.className = 'archive-detail';
    detailDiv.id = 'archiveDayDetail';
    detailDiv.style.display = 'none';
    archiveContent.appendChild(detailDiv);

    // Обработчики клика по дням
    calDiv.querySelectorAll('.day-cell[data-date]').forEach(cell => {
        cell.addEventListener('click', function() {
            const dk = this.dataset.date;
            const dayApps = appointments[dk] || [];
            const detail = document.getElementById('archiveDayDetail');
            if (dayApps.length === 0) {
                detail.style.display = 'block';
                detail.innerHTML = '<h4>Нет записей на этот день</h4>';
            } else {
                const [y,m,d] = dk.split('-').map(Number);
                const dateStr = new Date(y,m-1,d).toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'short'});
                let listHtml = `<h4>${dateStr}</h4>`;
                dayApps.forEach(app => {
                    const end = `${parseInt(app.time)+2}:00`;
                    listHtml += `<div class="booking-info"><strong>${app.time}-${end}</strong> — ${app.name} (${app.phone})</div>`;
                });
                detail.innerHTML = listHtml;
                detail.style.display = 'block';
            }
        });
    });

    document.getElementById('backToMonths').addEventListener('click', ()=>buildMonthsList(year));
}

    // ===== ПОИСК ОКНА =====
// ===== ПОИСК ОКНА (обновлённый) =====
const searchWindowBtn = document.getElementById('searchWindowBtn');
const searchModal = document.getElementById('searchModal');
const closeSearchModal = document.getElementById('closeSearchModal');
const searchBtn = document.getElementById('searchBtn');
const searchResults = document.getElementById('searchResults');
const searchFromTodayBtn = document.getElementById('searchFromTodayBtn');

searchWindowBtn.addEventListener('click', () => {
    // При открытии сразу заполняем от завтрашнего дня (запись только с завтра)
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate()+1);
    document.getElementById('searchStartDate').value = tomorrow.toISOString().split('T')[0];
    document.getElementById('searchEndDate').value = '';
    document.getElementById('searchTimeFrom').value = '08:00';
    document.getElementById('searchTimeTo').value = '18:00';
    searchResults.innerHTML = '';
    searchModal.classList.add('active');
});
closeSearchModal.addEventListener('click', () => searchModal.classList.remove('active'));

searchFromTodayBtn.addEventListener('click', () => {
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate()+1);
    document.getElementById('searchStartDate').value = tomorrow.toISOString().split('T')[0];
});

searchBtn.addEventListener('click', () => {
    const start = document.getElementById('searchStartDate').value;
    const end = document.getElementById('searchEndDate').value;
    const timeFrom = document.getElementById('searchTimeFrom').value;
    const timeTo = document.getElementById('searchTimeTo').value;

    if (!start) { alert('Выберите начальную дату'); return; }
    const startDate = new Date(start);
    const endDate = end ? new Date(end) : null;
    // Если конечная дата не указана, ищем месяц вперёд
    const maxDate = endDate || new Date(startDate.getFullYear(), startDate.getMonth()+1, 0);

    // Преобразуем время в минуты для сравнения
    const fromMinutes = timeFrom ? parseInt(timeFrom.split(':')[0])*60 + parseInt(timeFrom.split(':')[1]) : 8*60;
    const toMinutes = timeTo ? parseInt(timeTo.split(':')[0])*60 + parseInt(timeTo.split(':')[1]) : 18*60;

    const results = [];
    const current = new Date(startDate);
    while (current <= maxDate) {
        if (isDateInPast(current)) { current.setDate(current.getDate()+1); continue; }
        const dk = formatDateKey(current);
        if (!isDayOff(dk)) {
            const booked = getBookedSlotsForDate(current);
            allTimeSlots.forEach(time => {
                const [h,m] = time.split(':').map(Number);
                const slotMinutes = h*60 + m;
                // Проверка, попадает ли слот в указанный временной диапазон
                if (slotMinutes >= fromMinutes && slotMinutes < toMinutes) {
                    if (!booked.includes(time) && !isPastSlot(current, time)) {
                        results.push({ date: new Date(current), time });
                    }
                }
            });
        }
        current.setDate(current.getDate()+1);
    }

    if (results.length === 0) {
        searchResults.innerHTML = '<p style="color:#b3436e;">Нет свободных окон в выбранном диапазоне.</p>';
    } else {
        searchResults.innerHTML = results.map(r => {
            const d = r.date.toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'short'});
            return `<div class="search-result-item" style="margin-bottom:6px;background:#fff0f5;padding:6px 12px;border-radius:12px;cursor:pointer;" data-date="${formatDateKey(r.date)}" data-time="${r.time}">${d} ${r.time}-${parseInt(r.time)+2}:00</div>`;
        }).join('');

        // Делаем результаты кликабельными: при клике переходим к записи на этот день и время
        document.querySelectorAll('.search-result-item').forEach(item => {
            item.addEventListener('click', function() {
                const dateKey = this.dataset.date;
                const time = this.dataset.time;
                // Закрываем модалку
                searchModal.classList.remove('active');
                // Устанавливаем выбранную дату и время в основном календаре
                const [y,m,d] = dateKey.split('-').map(Number);
                selectedDate = new Date(y,m-1,d);
                selectedTime = time;
                // Переключаемся на главную страницу, если были в архиве
                mainPage.classList.add('active');
                archivePage.classList.remove('active');
                // Обновляем календарь и показываем форму записи
                currentYear = selectedDate.getFullYear();
                currentMonth = selectedDate.getMonth();
                renderAll();
                updateUIForSelectedDate();
                // Прокручиваем к форме
                bookingFormArea.scrollIntoView({ behavior: 'smooth' });
            });
        });
    }
});
    // Инициализация
    subscribeToUpdates();
</script>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('SW registered'))
                .catch(err => console.log('SW error', err));
        });
    }
</script>
