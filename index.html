<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manik</title>
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0d0d0d 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .loader-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 20, 0.95); backdrop-filter: blur(15px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 999; transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .loader-container.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .spinner {
            width: 60px; height: 60px; border-radius: 50%;
            background: conic-gradient(#ff7eb3, #ff758c, #ff7eb3);
            animation: spin 1s linear infinite;
            box-shadow: 0 0 20px rgba(255, 126, 179, 0.5);
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-text { color: #ff7eb3; font-weight: 600; font-size: 1.3rem; margin-top: 20px; text-shadow: 0 0 10px rgba(255, 126, 179, 0.5); }

        .app-container {
            width: 100%; max-width: 950px;
            background: rgba(20, 20, 35, 0.8); backdrop-filter: blur(30px);
            border-radius: 40px; box-shadow: 0 40px 60px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,126,179,0.2);
            padding: 25px 25px; opacity: 0; transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s ease;
            border: 1px solid rgba(255,126,179,0.3);
        }
        .app-container.visible { opacity: 1; transform: translateY(0); }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; flex-wrap: wrap; gap: 15px;
        }
        .logo {
            font-size: 2.4rem; font-weight: 700;
            background: linear-gradient(45deg, #ff7eb3, #ff758c, #ff7eb3);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(255,126,179,0.3);
            animation: gradientShift 3s infinite alternate;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .menu-btn {
            background: linear-gradient(135deg, #ff7eb3, #ff758c);
            border: none; color: white; font-weight: 600; padding: 10px 20px;
            border-radius: 25px; cursor: pointer; font-size: 0.9rem;
            transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(255,126,179,0.4);
            display: flex; align-items: center; gap: 8px;
        }
        .menu-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,126,179,0.6); }
        .menu-btn:active { transform: scale(0.95); }

        .dropdown { position: relative; display: inline-block; }
        .dropdown-content {
            display: none; position: absolute; right: 0; top: 50px;
            background: rgba(25,25,45,0.95); backdrop-filter: blur(20px);
            border-radius: 20px; min-width: 220px; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            z-index: 100; padding: 10px; border: 1px solid rgba(255,126,179,0.4);
        }
        .dropdown-content button {
            display: block; width: 100%; background: transparent; border: none;
            color: white; padding: 10px 15px; text-align: left; border-radius: 12px;
            margin-bottom: 5px; transition: all 0.2s ease; font-weight: 500;
        }
        .dropdown-content button:hover { background: rgba(255,126,179,0.2); transform: translateX(5px); }
        .dropdown-content button:last-child { margin-bottom: 0; }
        .show { display: block; animation: fadeInDropdown 0.3s ease; }
        @keyframes fadeInDropdown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin: 20px 0; }
        .month-year {
            font-size: 1.5rem; font-weight: 600; color: #ff7eb3;
            background: rgba(255,126,179,0.1); padding: 8px 25px;
            border-radius: 25px; box-shadow: 0 0 15px rgba(255,126,179,0.3);
        }
        .nav-btn {
            background: rgba(255,126,179,0.2); border: none; width: 45px; height: 45px;
            border-radius: 50%; color: #ff7eb3; font-size: 1.4rem; cursor: pointer;
            transition: all 0.3s ease; display: flex; align-items: center; justify-content: center;
        }
        .nav-btn:hover { background: rgba(255,126,179,0.5); box-shadow: 0 0 20px rgba(255,126,179,0.6); }

        .weekdays { display: grid; grid-template-columns: repeat(7,1fr); text-align: center; color: #ff7eb3; margin-bottom: 5px; }
        .days-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 8px; margin: 20px 0; }
        .day-cell {
            aspect-ratio: 1/1; background: rgba(255,255,255,0.05); border-radius: 15px;
            display: flex; align-items: center; justify-content: center; font-weight: 500;
            color: #ccc; cursor: pointer; transition: all 0.3s ease; border: 1px solid transparent;
            animation: fadeInCell 0.4s ease backwards;
        }
        @keyframes fadeInCell {
            from { opacity: 0; transform: scale(0.7); }
            to { opacity: 1; transform: scale(1); }
        }
        .day-cell:hover:not(.day-off):not(.other-month) {
            background: rgba(255,126,179,0.3); transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255,126,179,0.4); border-color: #ff7eb3;
        }
        .day-cell.today { border: 2px solid #ff7eb3; color: #ff7eb3; }
        .day-cell.selected {
            background: linear-gradient(135deg, #ff7eb3, #ff758c); color: white;
            box-shadow: 0 0 20px rgba(255,126,179,0.7);
        }
        .day-cell.other-month { color: #555; opacity: 0.4; cursor: default; }
        .day-cell.day-off { background: rgba(100,100,100,0.2); color: #888; text-decoration: line-through; }
        .day-cell.has-appointments::before { content: ''; position: absolute; bottom: 4px; width: 6px; height: 6px; background: #ff7eb3; border-radius: 50%; }

        .time-slots { display: flex; flex-wrap: wrap; gap: 10px; margin: 15px 0; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .time-slot {
            padding: 10px 20px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,126,179,0.3); border-radius: 25px;
            color: #ddd; cursor: pointer; transition: all 0.3s ease;
        }
        .time-slot:hover:not(.booked):not(.unavailable) {
            background: rgba(255,126,179,0.3); transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,126,179,0.4);
        }
        .time-slot.selected-time { background: #ff7eb3; color: white; box-shadow: 0 0 20px rgba(255,126,179,0.7); }
        .time-slot.booked, .time-slot.unavailable { background: rgba(80,80,80,0.4); color: #999; text-decoration: line-through; cursor: not-allowed; }

        .booking-form {
            display: flex; flex-direction: column; gap: 12px; margin-top: 20px;
            background: rgba(255,255,255,0.03); border-radius: 25px; padding: 25px;
            backdrop-filter: blur(10px); border: 1px solid rgba(255,126,179,0.2);
            animation: fadeIn 0.6s ease;
        }
        .booking-form input, .booking-form textarea {
            padding: 12px 20px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,126,179,0.4); border-radius: 25px;
            color: white; font-size: 1rem; outline: none; transition: all 0.3s ease;
        }
        .booking-form input:focus, .booking-form textarea:focus {
            border-color: #ff7eb3; box-shadow: 0 0 15px rgba(255,126,179,0.4);
        }
        .book-btn {
            background: linear-gradient(135deg, #ff7eb3, #ff758c); border: none;
            color: white; font-weight: 600; padding: 14px; border-radius: 30px;
            font-size: 1.1rem; cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(255,126,179,0.5);
        }
        .book-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(255,126,179,0.7); }

        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center;
            z-index: 200; opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        .modal.active { opacity: 1; visibility: visible; }
        .modal-content {
            background: rgba(25,25,45,0.95); backdrop-filter: blur(25px);
            border-radius: 30px; padding: 30px; max-width: 450px; width: 90%;
            border: 1px solid rgba(255,126,179,0.4); box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            transform: scale(0.9); transition: transform 0.3s ease;
        }
        .modal.active .modal-content { transform: scale(1); }
        .modal-content input, .modal-content select, .modal-content textarea {
            width: 100%; margin: 10px 0; padding: 12px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,126,179,0.3);
            border-radius: 20px; color: white;
        }
        .modal-btn {
            padding: 10px 25px; border-radius: 25px; font-weight: 600;
            cursor: pointer; border: none; margin: 5px; transition: all 0.3s ease;
        }
        .btn-primary { background: linear-gradient(135deg, #ff7eb3, #ff758c); color: white; box-shadow: 0 5px 20px rgba(255,126,179,0.5); }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #ccc; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,126,179,0.7); }
        .btn-secondary:hover { background: rgba(255,255,255,0.2); }

        .chat-container { height: 300px; overflow-y: auto; margin: 15px 0; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 15px; }
        .message { margin: 8px 0; padding: 10px 15px; border-radius: 20px; max-width: 80%; animation: fadeIn 0.3s ease; }
        .user-message { background: rgba(255,126,179,0.3); margin-left: auto; color: white; }
        .bot-message { background: rgba(255,255,255,0.1); margin-right: auto; color: #ddd; }

        /* Экран входа */
        .login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10,10,20,0.95); backdrop-filter: blur(15px);
            display: flex; justify-content: center; align-items: center;
            z-index: 300;
        }
        .tab-buttons { display: flex; margin-bottom: 20px; }
        .tab-btn {
            flex: 1; padding: 10px; border-radius: 20px; border: none;
            font-weight: 600; cursor: pointer; transition: all 0.3s ease;
        }
        .tab-btn.active { background: linear-gradient(135deg, #ff7eb3, #ff758c); color: white; }
        .tab-btn:not(.active) { background: rgba(255,255,255,0.1); color: #ccc; }
    </style>
</head>
<body>
<div class="loader-container" id="loader">
    <div class="spinner"></div>
    <div class="loader-text">Manik загружается...</div>
</div>

<!-- Экран входа (обязательный) -->
<div class="login-screen" id="loginScreen">
    <div class="modal-content" style="max-width: 400px;">
        <div class="tab-buttons">
            <button class="tab-btn active" id="showLoginTab">Войти</button>

        </div>

        <div id="registerForm" style="display:none;">
            <input type="email" id="registerEmail" placeholder="Email" required>
            <input type="password" id="registerPassword" placeholder="Пароль" required>
            <input type="text" id="registerMasterKey" placeholder="Ключ мастера (если есть)">
            <button class="modal-btn btn-primary" id="registerSubmitBtn" style="width:100%;">Зарегистрироваться</button>

        <p id="loginError" style="color:#ff7eb3; margin-top:10px; display:none; text-align:center;"></p>
    </div>
</div>

<div class="app-container" id="appContainer">
    <div class="header">
        <div class="logo">💅 Manik</div>
        <div class="dropdown">
            <button class="menu-btn" id="menuBtn">☰ Меню</button>
            <div class="dropdown-content" id="dropdownMenu">
                <button id="archiveBtn">📂 Архив</button>
                <button id="myBookingsBtn">📋 Мои записи</button>
                <button id="aiChatBtn">🤖 ИИ консультант</button>
                <button id="searchWindowBtn">🔍 Поиск окна</button>
                <button id="blacklistBtn" style="display:none;">🚫 Чёрный список</button>
                <button id="logoutBtn">🚪 Выйти</button>
            </div>
        </div>
    </div>

    <div id="mainPage">
        <div class="calendar-header">
            <button class="nav-btn" id="prevMonth">◀</button>
            <span class="month-year" id="monthYear"></span>
            <button class="nav-btn" id="nextMonth">▶</button>
        </div>
        <div class="weekdays">
            <span>Вс</span><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span>
        </div>
        <div class="days-grid" id="daysGrid"></div>
        <div style="background:rgba(255,126,179,0.1);border-radius:20px;padding:15px;margin:15px 0;color:#ff7eb3;" id="selectedDateDisplay">
            📅 Дата не выбрана
        </div>
        <div id="timeSelectionArea" style="display:none;">
            <div style="font-weight:600;color:#ff7eb3;margin-bottom:8px;">Доступное время (2 часа):</div>
            <div class="time-slots" id="timeSlotsContainer"></div>
        </div>
        <div id="bookingFormArea" style="display:none;" class="booking-form">
            <input type="text" id="clientName" placeholder="Ваше имя">
            <input type="tel" id="clientPhone" placeholder="Телефон (11 цифр)">
            <textarea id="clientNote" placeholder="Заметка (необязательно)" rows="2"></textarea>
            <input type="file" id="designFile" accept="image/*" style="display:none;">
            <button class="book-btn" id="bookBtn">Записаться</button>
        </div>
        <div id="adminBookings" style="display:none;margin-top:30px;background:rgba(255,126,179,0.05);border-radius:20px;padding:20px;">
            <h2 style="color:#ff7eb3;">Все записи</h2>
            <div id="bookingsContainer"></div>
        </div>
        <div id="dayOffControl" style="margin-top:10px;text-align:center;"></div>
    </div>
</div>

<!-- Модальные окна -->
<div class="modal" id="messageModal">
    <div class="modal-content">
        <p id="messageText" style="color:#ddd;"></p>
        <button class="modal-btn btn-primary" id="closeMessageModal">OK</button>
    </div>
</div>

<div class="modal" id="aiChatModal">
    <div class="modal-content" style="max-width:500px;">
        <h3 style="color:#ff7eb3;">🤖 ИИ консультант по маникюру</h3>
        <div class="chat-container" id="chatContainer"></div>
        <input type="text" id="chatInput" placeholder="Опишите, что хотите...">
        <button class="modal-btn btn-primary" id="sendChatBtn">Спросить</button>
        <button class="modal-btn btn-secondary" id="closeAiChatBtn">Закрыть</button>
    </div>
</div>

<div class="modal" id="blacklistModal">
    <div class="modal-content">
        <h3 style="color:#ff7eb3;">Чёрный список</h3>
        <div id="blacklistList"></div>
        <input type="text" id="newBlacklistPhone" placeholder="Номер">
        <button class="modal-btn btn-primary" id="addBlacklistBtn">Добавить</button>
        <button class="modal-btn btn-secondary" id="closeBlacklistModal">Закрыть</button>
    </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>

<script>
    // ⚠️ ЗАМЕНИТЕ НА ВАШИ КЛЮЧИ
    const firebaseConfig = {
        apiKey: "AIzaSyCetvGM77zUc_Llh5p-FLTF6PkvH-lCPQ8",
        authDomain: "manik-56a31.firebaseapp.com",
        projectId: "manik-56a31",
        storageBucket: "manik-56a31.firebasestorage.app",
        messagingSenderId: "540265958043",
        appId: "1:540265958043:web:f3dd0d7ee6b9c9ffbe543e",
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();
    db.enablePersistence().catch(() => {});

    // Глобальные переменные
    let masterKey = null;
    let currentMonth = new Date().getMonth();
    let currentYear = new Date().getFullYear();
    let selectedDate = null;
    let selectedTime = null;
    let isAdmin = false;
    let appointments = {};
    let daysOff = [];
    let blacklist = [];
    const allTimeSlots = ['08:00','10:00','12:00','14:00','16:00','18:00'];
    let firstLoadCompleted = false;
    let currentUser = null;

    // DOM элементы
    const loader = document.getElementById('loader');
    const appContainer = document.getElementById('appContainer');
    const loginScreen = document.getElementById('loginScreen');
    const loginError = document.getElementById('loginError');
    const dropdownMenu = document.getElementById('dropdownMenu');
    const menuBtn = document.getElementById('menuBtn');
    const archiveBtn = document.getElementById('archiveBtn');
    const myBookingsBtn = document.getElementById('myBookingsBtn');
    const aiChatBtn = document.getElementById('aiChatBtn');
    const searchWindowBtn = document.getElementById('searchWindowBtn');
    const blacklistBtn = document.getElementById('blacklistBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const mainPage = document.getElementById('mainPage');
    const monthYearEl = document.getElementById('monthYear');
    const daysGridEl = document.getElementById('daysGrid');
    const selectedDateDisplay = document.getElementById('selectedDateDisplay');
    const timeSelectionArea = document.getElementById('timeSelectionArea');
    let timeSlotsContainer = document.getElementById('timeSlotsContainer');
    const bookingFormArea = document.getElementById('bookingFormArea');
    const bookBtn = document.getElementById('bookBtn');
    const clientNameInput = document.getElementById('clientName');
    const clientPhoneInput = document.getElementById('clientPhone');
    const clientNoteInput = document.getElementById('clientNote');
    const designFileInput = document.getElementById('designFile');
    const adminBookings = document.getElementById('adminBookings');
    const bookingsContainer = document.getElementById('bookingsContainer');
    const dayOffControl = document.getElementById('dayOffControl');
    const messageModal = document.getElementById('messageModal');
    const aiChatModal = document.getElementById('aiChatModal');
    const blacklistModal = document.getElementById('blacklistModal');
    const chatContainer = document.getElementById('chatContainer');
    const chatInput = document.getElementById('chatInput');

    const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

    // Выпадающее меню
    menuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdownMenu.classList.toggle('show');
    });
    window.addEventListener('click', () => dropdownMenu.classList.remove('show'));

    // Универсальное сообщение
    function showMessage(text) {
        document.getElementById('messageText').textContent = text;
        messageModal.classList.add('active');
    }
    document.getElementById('closeMessageModal').addEventListener('click', () => messageModal.classList.remove('active'));

    // Загрузка данных
    async function loadMasterKey() {
        const doc = await db.collection('settings').doc('masterKey').get();
        masterKey = doc.exists ? doc.data().key : null;
    }
    async function loadData() {
        const [daysSnap, apptSnap] = await Promise.all([
            db.collection('daysOff').get(),
            db.collection('appointments').get()
        ]);
        daysOff = daysSnap.docs.map(d => d.id);
        appointments = {};
        apptSnap.forEach(doc => {
            const data = doc.data();
            const dateKey = doc.id.split('_')[0];
            if (!appointments[dateKey]) appointments[dateKey] = [];
            appointments[dateKey].push({...data, docId: doc.id});
        });
    }
    function loadBlacklist() {
        return db.collection('blacklist').get().then(snap => {
            blacklist = snap.docs.map(d => d.id);
        });
    }

    // Авторизация
    function showLoginScreen() {
        loginScreen.style.display = 'flex';
        appContainer.classList.remove('visible');
        loader.classList.add('hidden');
    }
    function hideLoginScreen() {
        loginScreen.style.display = 'none';
    }
    function logout() {
        auth.signOut();
        hideLoginScreen();
        showLoginScreen();
    }

    async function initializeAuth() {
        await loadMasterKey();

        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                currentUser = null;
                isAdmin = false;
                showLoginScreen();
                return;
            }
            currentUser = user;
            const masterDoc = await db.collection('masters').doc(user.uid).get();
            isAdmin = masterDoc.exists;
            hideLoginScreen();
            if (!firstLoadCompleted) {
                await loadData();
                await loadBlacklist();
                firstLoadCompleted = true;
                finishLoading();
            }
            updateUIForRole();
            renderAll();
            if (isAdmin) renderAdminBookings();
        });

        document.getElementById('showLoginTab').addEventListener('click', () => {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('showLoginTab').classList.add('active');
            document.getElementById('showRegisterTab').classList.remove('active');
        });
        document.getElementById('showRegisterTab').addEventListener('click', () => {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            document.getElementById('showRegisterTab').classList.add('active');
            document.getElementById('showLoginTab').classList.remove('active');
        });

        document.getElementById('loginSubmitBtn').addEventListener('click', async () => {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            if (!email || !password) {
                loginError.textContent = 'Введите email и пароль';
                loginError.style.display = 'block';
                return;
            }
            try {
                await auth.signInWithEmailAndPassword(email, password);
            } catch (err) {
                loginError.textContent = 'Ошибка: ' + err.message;
                loginError.style.display = 'block';
            }
        });

        document.getElementById('registerSubmitBtn').addEventListener('click', async () => {
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value.trim();
            if (!email || !password) {
                loginError.textContent = 'Введите email и пароль';
                loginError.style.display = 'block';
                return;
            }
            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;
                const enteredKey = document.getElementById('registerMasterKey').value.trim();
                if (enteredKey === masterKey) {
                    await db.collection('masters').doc(user.uid).set({ email: user.email });
                }
            } catch (err) {
                loginError.textContent = 'Ошибка: ' + err.message;
                loginError.style.display = 'block';
            }
        });

        document.getElementById('forgotPasswordLink').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = prompt('Введите ваш email для восстановления пароля:');
            if (!email) return;
            try {
                await auth.sendPasswordResetEmail(email);
                showMessage('Письмо для сброса пароля отправлено на ' + email);
            } catch (err) {
                showMessage('Ошибка: ' + err.message);
            }
        });

        logoutBtn.addEventListener('click', logout);
    }

    function finishLoading() {
        setTimeout(() => {
            loader.classList.add('hidden');
            appContainer.classList.add('visible');
        }, 500);
    }

    function updateUIForRole() {
        blacklistBtn.style.display = isAdmin ? 'inline-block' : 'none';
        if (!isAdmin) {
            adminBookings.style.display = 'none';
            dayOffControl.innerHTML = '';
        } else {
            if (selectedDate) updateDayOffButton();
            renderAdminBookings();
        }
    }

    initializeAuth();

    // Продолжение (календарь, запись, чат, архив и т.д.) будет во второй части.
        // ---------- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ----------
    function formatDateKey(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    function isToday(d) { const t=new Date(); return d.getFullYear()===t.getFullYear() && d.getMonth()===t.getMonth() && d.getDate()===t.getDate(); }
    function isDayOff(dk) { return daysOff.includes(dk); }
    function getBookedSlotsForDate(d) { const k=formatDateKey(d); return appointments[k] ? appointments[k].map(a=>a.time) : []; }
    function isPastSlot(d,time) { if(!isToday(d)) return false; const [h,m]=time.split(':').map(Number); const end=new Date(d.getFullYear(),d.getMonth(),d.getDate(),h+2,m); return end <= new Date(); }
    function isDateInPast(d) { const tomorrow=new Date(); tomorrow.setDate(tomorrow.getDate()+1); tomorrow.setHours(0,0,0,0); return new Date(d.getFullYear(),d.getMonth(),d.getDate()) < tomorrow; }

    function renderAll() {
        renderCalendar();
        if (selectedDate) {
            updateUIForSelectedDate();
            updateDayOffButton();
        } else {
            dayOffControl.innerHTML = '';
        }
    }

    // ---------- КАЛЕНДАРЬ ----------
    function renderCalendar() {
        monthYearEl.textContent = `${monthNames[currentMonth]} ${currentYear}`;
        const firstDay = new Date(currentYear, currentMonth, 1).getDay();
        const daysInMonth = new Date(currentYear, currentMonth+1, 0).getDate();
        const prevMonthDays = new Date(currentYear, currentMonth, 0).getDate();
        let html = '';
        for (let i = firstDay-1; i >= 0; i--) html += `<div class="day-cell other-month">${prevMonthDays - i}</div>`;
        for (let d=1; d<=daysInMonth; d++) {
            const date = new Date(currentYear, currentMonth, d);
            const dk = formatDateKey(date);
            let cls = 'day-cell';
            if (isToday(date)) cls += ' today';
            if (selectedDate && formatDateKey(selectedDate)===dk) cls += ' selected';
            if (isDayOff(dk)) cls += ' day-off';
            if (appointments[dk]?.length) cls += ' has-appointments';
            html += `<div class="${cls}" data-date="${dk}" style="animation-delay:${d*0.02}s">${d}</div>`;
        }
        const total = firstDay + daysInMonth;
        const rem = total%7 ? 7 - total%7 : 0;
        for (let d=1; d<=rem; d++) html += `<div class="day-cell other-month">${d}</div>`;
        daysGridEl.innerHTML = html;
        document.querySelectorAll('.day-cell[data-date]').forEach(cell => {
            cell.addEventListener('click', function() {
                const dk = this.dataset.date;
                const [y,m,d] = dk.split('-').map(Number);
                selectedDate = new Date(y,m-1,d);
                selectedTime = null;
                updateUIForSelectedDate();
                updateDayOffButton();
                renderCalendar();
            });
        });
    }

    function updateUIForSelectedDate() {
        if (!selectedDate) {
            selectedDateDisplay.innerHTML = '📅 Дата не выбрана';
            timeSelectionArea.style.display = 'none';
            bookingFormArea.style.display = 'none';
            return;
        }
        const dk = formatDateKey(selectedDate);
        selectedDateDisplay.innerHTML = `📅 ${selectedDate.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}`;
        timeSelectionArea.innerHTML = '<div style="font-weight:600;color:#ff7eb3;margin-bottom:5px;">Доступное время (2 часа):</div><div class="time-slots" id="timeSlotsContainer"></div>';
        timeSlotsContainer = document.getElementById('timeSlotsContainer');
        timeSelectionArea.style.display = 'block';
        if (isDateInPast(selectedDate)) {
            timeSelectionArea.innerHTML = '<div style="color:#ff7eb3;text-align:center;">⛔ Запись только с завтрашнего дня</div>';
            bookingFormArea.style.display = 'none';
            return;
        }
        if (isDayOff(dk)) {
            timeSelectionArea.style.display = 'none';
            bookingFormArea.style.display = 'none';
            return;
        }
        const booked = getBookedSlotsForDate(selectedDate);
        let slotsHtml = '';
        allTimeSlots.forEach(time => {
            const end = `${parseInt(time)+2}:00`;
            const isB = booked.includes(time);
            const past = isPastSlot(selectedDate, time);
            let cls = 'time-slot';
            if (isB) cls+=' booked'; else if (past) cls+=' unavailable';
            if (selectedTime===time && !isB && !past) cls+=' selected-time';
            slotsHtml += `<div class="${cls}" data-time="${time}">${time}<small> до ${end}</small></div>`;
        });
        timeSlotsContainer.innerHTML = slotsHtml;
        if (selectedTime && (booked.includes(selectedTime) || isPastSlot(selectedDate,selectedTime))) selectedTime=null;
        bookingFormArea.style.display = selectedTime ? 'flex' : 'none';
        document.querySelectorAll('.time-slot:not(.booked):not(.unavailable)').forEach(s=>{
            s.addEventListener('click', function(){
                const t = this.dataset.time;
                if (getBookedSlotsForDate(selectedDate).includes(t) || isPastSlot(selectedDate,t)) { updateUIForSelectedDate(); return; }
                selectedTime = t; updateUIForSelectedDate();
            });
        });
    }

    function updateDayOffButton() {
        if (!isAdmin || !selectedDate) { dayOffControl.innerHTML = ''; return; }
        const dk = formatDateKey(selectedDate);
        const isOff = isDayOff(dk);
        dayOffControl.innerHTML = `<button class="modal-btn btn-primary" id="toggleDayOffBtn">${isOff ? 'Сделать рабочим' : 'Сделать выходным'}</button>`;
        document.getElementById('toggleDayOffBtn').addEventListener('click', async () => {
            if (isDayOff(dk)) {
                await db.collection('daysOff').doc(dk).delete();
            } else {
                await db.collection('daysOff').doc(dk).set({});
            }
        });
    }

    // ---------- ЗАПИСЬ КЛИЕНТА ----------
    bookBtn.addEventListener('click', async () => {
        if (!selectedDate || !selectedTime) return;
        const dk = formatDateKey(selectedDate);
        if (isDateInPast(selectedDate)) { showMessage('Нельзя записаться на прошедший день.'); return; }
        if (isDayOff(dk)) { showMessage('Выходной.'); return; }
        const name = clientNameInput.value.trim();
        const phoneRaw = clientPhoneInput.value.trim();
        const phone = phoneRaw.replace(/\D/g,'');
        if (!name || !phoneRaw) { showMessage('Введите имя и телефон.'); return; }
        if (!/^\d{11}$/.test(phone)) { showMessage('Номер должен содержать 11 цифр.'); return; }
        if (blacklist.includes(phone)) { showMessage('Этот номер заблокирован.'); return; }
        const existing = hasAppointmentWithinWeek(phone);
        if (existing) {
            const d = new Date(existing.dateKey);
            const dateStr = d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'short'});
            showMessage(`Вы уже записаны на ${dateStr} в ${existing.time}-${parseInt(existing.time)+2}:00.`);
            return;
        }
        const note = clientNoteInput.value.trim();
        let designUrl = null;
        if (designFileInput.files[0]) {
            const file = designFileInput.files[0];
            const storageRef = storage.ref(`designs/${dk}_${selectedTime}_${Date.now()}`);
            await storageRef.put(file);
            designUrl = await storageRef.getDownloadURL();
        }
        try {
            await db.collection('appointments').doc(`${dk}_${selectedTime}`).set({
                time: selectedTime, name, phone, note, designUrl, userId: currentUser?.uid || 'unknown'
            });
            clientNameInput.value = ''; clientPhoneInput.value = ''; clientNoteInput.value = '';
            designFileInput.value = ''; selectedTime = null;
            updateUIForSelectedDate();
            showMessage('✅ Вы записаны!');
        } catch(e) { showMessage('Ошибка: '+e.message); }
    });

    function hasAppointmentWithinWeek(phone) {
        const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate()+1); tomorrow.setHours(0,0,0,0);
        const weekLater = new Date(tomorrow); weekLater.setDate(weekLater.getDate()+7);
        for (const [dateKey, apps] of Object.entries(appointments)) {
            const [y,m,d] = dateKey.split('-').map(Number);
            const date = new Date(y,m-1,d);
            if (date >= tomorrow && date <= weekLater) {
                for (const app of apps) if (app.phone === phone) return app;
            }
        }
        return null;
    }

    // ---------- ИИ ЧАТ (БЕЗ КЛЮЧА В КОДЕ) ----------
    aiChatBtn.addEventListener('click', () => aiChatModal.classList.add('active'));
    document.getElementById('closeAiChatBtn').addEventListener('click', () => aiChatModal.classList.remove('active'));
    document.getElementById('sendChatBtn').addEventListener('click', sendChat);
    chatInput.addEventListener('keypress', (e) => { if (e.key==='Enter') sendChat(); });

    function sendChat() {
        const msg = chatInput.value.trim();
        if (!msg) return;
        addChatMessage('user', msg);
        chatInput.value = '';

        const askAI = firebase.functions().httpsCallable('askAI');
        askAI({ message: msg })
            .then(result => addChatMessage('bot', result.data.reply))
            .catch(error => addChatMessage('bot', 'Ошибка: ' + error.message));
    }

    function addChatMessage(type, text) {
        const div = document.createElement('div');
        div.className = `message ${type==='user'?'user-message':'bot-message'}`;
        div.textContent = text;
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // ---------- АРХИВ (МОДАЛЬНОЕ ОКНО) ----------
    const archiveModal = document.createElement('div');
    archiveModal.className = 'modal';
    archiveModal.id = 'archiveModal';
    archiveModal.innerHTML = `
        <div class="modal-content" style="max-width:800px;">
            <h3 style="color:#ff7eb3;">Архив записей</h3>
            <div class="archive-container" style="display:flex; gap:15px; margin-top:15px; max-height:60vh;">
                <div class="years-sidebar" id="archiveYears" style="flex:0 0 80px; overflow-y:auto; background:rgba(255,255,255,0.05); border-radius:15px; padding:10px;"></div>
                <div style="flex:1; overflow-y:auto;" id="archiveMain">
                    <div class="archive-months" id="archiveMonths" style="display:flex; flex-wrap:wrap; gap:10px;"></div>
                    <div class="archive-days" id="archiveDays" style="margin-top:15px;"></div>
                    <div class="archive-detail" id="archiveDetail" style="margin-top:10px;"></div>
                </div>
            </div>
            <button class="modal-btn btn-secondary" id="closeArchiveModal" style="margin-top:15px;">Закрыть</button>
        </div>
    `;
    document.body.appendChild(archiveModal);

    let filteredAppointments = {};

    function openArchive(phone = null) {
        if (phone) {
            const cleaned = phone.replace(/\D/g,'');
            filteredAppointments = {};
            Object.entries(appointments).forEach(([dk, apps]) => {
                const filtered = apps.filter(a => a.phone === cleaned);
                if (filtered.length) filteredAppointments[dk] = filtered;
            });
        } else {
            filteredAppointments = {...appointments};
        }
        buildArchiveYears();
        document.getElementById('archiveModal').classList.add('active');
    }
    function buildArchiveYears() {
        const years = new Set();
        Object.keys(filteredAppointments).forEach(dk => years.add(dk.split('-')[0]));
        const container = document.getElementById('archiveYears');
        container.innerHTML = '';
        if (!years.size) {
            container.innerHTML = '<div style="color:#888;">Нет данных</div>';
            return;
        }
        Array.from(years).sort((a,b)=>b-a).forEach(y => {
            const btn = document.createElement('button');
            btn.textContent = y;
            btn.style.cssText = 'display:block;width:100%;background:transparent;color:white;border:none;padding:8px;border-radius:10px;margin-bottom:5px;cursor:pointer;transition:0.2s;';
            btn.addEventListener('mouseenter', ()=> btn.style.background = 'rgba(255,126,179,0.3)');
            btn.addEventListener('mouseleave', ()=> btn.style.background = 'transparent');
            btn.addEventListener('click', ()=> buildArchiveMonths(y));
            container.appendChild(btn);
        });
        if (years.size) container.querySelector('button').click();
    }
    function buildArchiveMonths(year) {
        const monthsWithApps = new Set();
        Object.keys(filteredAppointments).forEach(dk => {
            const [y,m] = dk.split('-');
            if (y === year) monthsWithApps.add(parseInt(m));
        });
        const container = document.getElementById('archiveMonths');
        container.innerHTML = '';
        for (let m = 1; m <= 12; m++) {
            const card = document.createElement('div');
            card.textContent = monthNames[m-1];
            card.style.cssText = 'padding:8px 12px; background:rgba(255,255,255,0.05); border-radius:12px; cursor:pointer; transition:0.2s; color:white;';
            if (monthsWithApps.has(m)) card.style.border = '1px solid #ff7eb3';
            card.addEventListener('mouseenter', ()=> card.style.background = 'rgba(255,126,179,0.2)');
            card.addEventListener('mouseleave', ()=> card.style.background = 'rgba(255,255,255,0.05)');
            card.addEventListener('click', ()=> showArchiveCalendar(year, m));
            container.appendChild(card);
        }
        document.getElementById('archiveDays').innerHTML = '';
        document.getElementById('archiveDetail').innerHTML = '';
    }
    function showArchiveCalendar(year, month) {
        const daysDiv = document.getElementById('archiveDays');
        const detailDiv = document.getElementById('archiveDetail');
        daysDiv.innerHTML = '';
        detailDiv.innerHTML = '';
        const firstDay = new Date(year, month-1, 1).getDay();
        const daysInMonth = new Date(year, month, 0).getDate();
        let html = '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;">';
        for (let i=0; i<firstDay; i++) html += '<div></div>';
        for (let d=1; d<=daysInMonth; d++) {
            const dateKey = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const apps = filteredAppointments[dateKey] || [];
            html += `<div style="text-align:center;padding:5px;border-radius:8px;cursor:pointer;${apps.length?'background:rgba(255,126,179,0.2);':''}" data-date="${dateKey}">${d}</div>`;
        }
        html += '</div>';
        daysDiv.innerHTML = html;
        daysDiv.querySelectorAll('[data-date]').forEach(el => {
            el.addEventListener('click', function() {
                const dk = this.dataset.date;
                const apps = filteredAppointments[dk] || [];
                if (!apps.length) {
                    detailDiv.innerHTML = '<p style="color:#888;">Нет записей</p>';
                    return;
                }
                const [y,m,d] = dk.split('-').map(Number);
                const dateStr = new Date(y,m-1,d).toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'short'});
                let list = `<h4 style="color:#ff7eb3;">${dateStr}</h4>`;
                apps.forEach(app => {
                    list += `<div style="background:rgba(255,255,255,0.05);padding:8px;border-radius:8px;margin-top:5px;">
                        <div>${app.time}-${parseInt(app.time)+2}:00 | ${app.name} (${app.phone})</div>
                        ${app.note ? `<div style="color:#aaa;">📝 ${app.note}</div>` : ''}
                        ${app.designUrl ? `<a href="${app.designUrl}" target="_blank" style="color:#ff7eb3;">📎 Дизайн</a>` : ''}
                    </div>`;
                });
                detailDiv.innerHTML = list;
            });
        });
    }

    archiveBtn.addEventListener('click', () => {
        if (isAdmin) {
            openArchive();
        } else {
            const phone = prompt('Введите ваш номер телефона для просмотра архива:');
            if (phone) openArchive(phone);
        }
    });
    document.getElementById('closeArchiveModal').addEventListener('click', ()=> document.getElementById('archiveModal').classList.remove('active'));

    // ---------- ПОИСК ОКНА ----------
    searchWindowBtn.addEventListener('click', ()=>{
        const modal = document.createElement('div');
        modal.className = 'modal active';
        modal.innerHTML = `
            <div class="modal-content">
                <h3 style="color:#ff7eb3;">Поиск свободного окна</h3>
                <label>С даты:</label>
                <input type="date" id="searchFrom">
                <label>По дату (необязательно):</label>
                <input type="date" id="searchTo">
                <label>Желаемое время:</label>
                <select id="searchTimeSlot">
                    <option value="">Любое</option>
                    ${allTimeSlots.map(t=>`<option value="${t}">${t}</option>`).join('')}
                </select>
                <button class="modal-btn btn-primary" id="doSearch">Искать</button>
                <div id="searchResults" style="margin-top:15px;max-height:200px;overflow-y:auto;"></div>
                <button class="modal-btn btn-secondary" id="closeSearch">Закрыть</button>
            </div>
        `;
        document.body.appendChild(modal);
        document.getElementById('doSearch').addEventListener('click', ()=>{
            const from = document.getElementById('searchFrom').valueAsDate || new Date();
            const to = document.getElementById('searchTo').valueAsDate || new Date(from.getFullYear(), from.getMonth()+2, 0);
            const desired = document.getElementById('searchTimeSlot').value;
            const results = [];
            let current = new Date(from);
            while (current <= to) {
                if (!isDateInPast(current)) {
                    const dk = formatDateKey(current);
                    if (!isDayOff(dk)) {
                        const booked = getBookedSlotsForDate(current);
                        allTimeSlots.forEach(time => {
                            if (desired && time !== desired) return;
                            if (!booked.includes(time) && !isPastSlot(current, time)) {
                                results.push({ date: new Date(current), time });
                            }
                        });
                    }
                }
                current.setDate(current.getDate()+1);
            }
            const container = document.getElementById('searchResults');
            container.innerHTML = results.length ? results.map(r => {
                const d = r.date.toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'short'});
                return `<div style="background:rgba(255,126,179,0.1);padding:5px 10px;border-radius:8px;margin-bottom:5px;">${d} ${r.time}-${parseInt(r.time)+2}:00</div>`;
            }).join('') : '<p style="color:#888;">Нет свободных окон.</p>';
        });
        modal.querySelector('#closeSearch').addEventListener('click', ()=> modal.remove());
    });

    // ---------- ЧЁРНЫЙ СПИСОК ----------
    blacklistBtn.addEventListener('click', ()=>{
        blacklistModal.classList.add('active');
        renderBlacklist();
    });
    document.getElementById('addBlacklistBtn').addEventListener('click', ()=>{
        const phone = document.getElementById('newBlacklistPhone').value.trim();
        if (phone && /^\d{11}$/.test(phone.replace(/\D/g,''))) {
            db.collection('blacklist').doc(phone.replace(/\D/g,'')).set({});
        } else {
            showMessage('Введите 11 цифр номера');
        }
    });
    document.getElementById('closeBlacklistModal').addEventListener('click', ()=> blacklistModal.classList.remove('active'));
    function renderBlacklist() {
        const list = document.getElementById('blacklistList');
        list.innerHTML = blacklist.map(phone => `
            <div style="display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,0.05);padding:8px;border-radius:10px;margin-bottom:5px;">
                <span>${phone}</span>
                <button data-phone="${phone}" style="background:none;border:none;color:#ff7eb3;cursor:pointer;">✕</button>
            </div>
        `).join('');
        list.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', ()=> db.collection('blacklist').doc(btn.dataset.phone).delete());
        });
    }
    db.collection('blacklist').onSnapshot(snap => {
        blacklist = snap.docs.map(d => d.id);
    });

    // ---------- АДМИН-ПАНЕЛЬ ----------
    function renderAdminBookings() {
        if (!isAdmin) { adminBookings.style.display = 'none'; return; }
        adminBookings.style.display = 'block';
        const now = new Date(); now.setHours(0,0,0,0);
        let items = '';
        Object.keys(appointments).sort().forEach(dk => {
            const [y,m,d] = dk.split('-').map(Number);
            const date = new Date(y,m-1,d);
            if (date < now) return;
            appointments[dk].forEach(app => {
                const end = `${parseInt(app.time)+2}:00`;
                items += `<div style="display:flex;justify-content:space-between;background:rgba(255,255,255,0.05);padding:10px;border-radius:12px;margin-bottom:8px;">
                    <div>
                        <div style="color:#ff7eb3;">${date.toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'short'})}</div>
                        <div>${app.time}-${end} | ${app.name} (${app.phone})</div>
                        ${app.note ? `<div style="color:#aaa;">📝 ${app.note}</div>` : ''}
                    </div>
                    <button class="delete-btn" data-docid="${app.docId}" style="background:#e74c3c;color:white;border:none;border-radius:15px;padding:5px 15px;cursor:pointer;">✕</button>
                </div>`;
            });
        });
        bookingsContainer.innerHTML = items || '<p style="color:#888;">Нет будущих записей</p>';
        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', async function() {
                if (confirm('Удалить эту запись?')) {
                    await db.collection('appointments').doc(this.dataset.docid).delete();
                }
            });
        });
    }

    db.collection('daysOff').onSnapshot(snap => {
        daysOff = snap.docs.map(d => d.id);
        if (selectedDate) updateDayOffButton();
    });

    function subscribeToUpdates() {
        db.collection('appointments').onSnapshot(snap => {
            appointments = {};
            snap.forEach(doc => {
                const data = doc.data();
                const dateKey = doc.id.split('_')[0];
                if (!appointments[dateKey]) appointments[dateKey] = [];
                appointments[dateKey].push({...data, docId: doc.id});
            });
            renderAll();
            if (isAdmin) renderAdminBookings();
        });
    }
    subscribeToUpdates();

    // ---------- НАВИГАЦИЯ ----------
    document.getElementById('prevMonth').addEventListener('click', ()=>{
        currentMonth--;
        if (currentMonth<0) { currentMonth=11; currentYear--; }
        selectedDate = null; selectedTime = null;
        renderAll();
    });
    document.getElementById('nextMonth').addEventListener('click', ()=>{
        currentMonth++;
        if (currentMonth>11) { currentMonth=0; currentYear++; }
        selectedDate = null; selectedTime = null;
        renderAll();
    });

    // ---------- ЗАВЕРШЕНИЕ ----------
    // Функция updateUIForRole уже определена выше (она просто вызывает renderAdminBookings и обновляет видимость)
    // Всё готово!
</script>
</body>
</html>
