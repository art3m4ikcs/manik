            if (!appointments[dateKey]) appointments[dateKey] = [];
            appointments[dateKey].push({...data, docId: doc.id});
        });

        hideLoginScreenFn();
        showLoginScreenFn();
    }

    // ---------- АВТОРИЗАЦИЯ (с восстановлением пароля) ----------
    async function initializeAuth() {
        await loadMasterKey();

        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                currentUser = null;
                isAdmin = false;
                showLoginScreenFn();
                return;
            }
            currentUser = user;
            const masterDoc = await db.collection('masters').doc(user.uid).get();
            isAdmin = masterDoc.exists;
            hideLoginScreenFn();
            if (!firstLoadCompleted) {
                await loadData();
                await loadBlacklist();
                firstLoadCompleted = true;
                finishLoading();
            }
            updateUIForRole();
            renderAll();
        });

        document.getElementById('showLoginTab').addEventListener('click', () => {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('showLoginTab').classList.add('active');
            document.getElementById('showRegisterTab').classList.remove('active');
        });
        document.getElementById('showRegisterTab').addEventListener('click', () => {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            document.getElementById('showRegisterTab').classList.add('active');
            document.getElementById('showLoginTab').classList.remove('active');
        });

        document.getElementById('loginSubmitBtn').addEventListener('click', async () => {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            if (!email || !password) { loginError.textContent = 'Введите email и пароль'; loginError.style.display = 'block'; return; }
            try { await auth.signInWithEmailAndPassword(email, password); }
            catch (err) { loginError.textContent = 'Ошибка: ' + err.message; loginError.style.display = 'block'; }
        });

        document.getElementById('registerSubmitBtn').addEventListener('click', async () => {
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value.trim();
            if (!email || !password) { loginError.textContent = 'Введите email и пароль'; loginError.style.display = 'block'; return; }
            try {
                const cred = await auth.createUserWithEmailAndPassword(email, password);
                const enteredKey = document.getElementById('registerMasterKey').value.trim();
                if (enteredKey === masterKey) {
                    await db.collection('masters').doc(cred.user.uid).set({ email: cred.user.email });
                }
            } catch (err) { loginError.textContent = 'Ошибка: ' + err.message; loginError.style.display = 'block'; }
        });

        // === ВОССТАНОВЛЕНИЕ ПАРОЛЯ (ИСПРАВЛЕНО) ===
        if (forgotPasswordLink) {
            forgotPasswordLink.addEventListener('click', (e) => {
                e.preventDefault();
                forgotPasswordModal.classList.add('active');
            });
        }
        document.getElementById('sendResetBtn').addEventListener('click', async () => {
            const email = document.getElementById('forgotEmail').value.trim();
            if (!email) { showMessage('Введите email'); return; }
            try {
                await auth.sendPasswordResetEmail(email);
                forgotPasswordModal.classList.remove('active');
                showMessage('Ссылка отправлена на ' + email);
            } catch (err) { showMessage('Ошибка: ' + err.message); }
        });
        document.getElementById('closeForgotModal').addEventListener('click', () => forgotPasswordModal.classList.remove('active'));

        logoutBtn.addEventListener('click', logout);
    }

    function formatDateKey(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    function isToday(d) { const t=new Date(); return d.getFullYear()===t.getFullYear() && d.getMonth()===t.getMonth() && d.getDate()===t.getDate(); }
    function isDayOff(dk) { return daysOff.includes(dk); }
    function getBookedSlotsForDate(d) { const k=formatDateKey(d); return appointments[k] ? appointments[k].map(a=>a.time) : []; }
    function isPastSlot(d,time) { if(!isToday(d)) return false; const [h,m]=time.split(':').map(Number); const end=new Date(d.getFullYear(),d.getMonth(),d.getDate(),h+2,m); return end <= new Date(); }
    function isDateInPast(d) { const tomorrow=new Date(); tomorrow.setDate(tomorrow.getDate()+1); tomorrow.setHours(0,0,0,0); return new Date(d.getFullYear(),d.getMonth(),d.getDate()) < tomorrow; }

    function renderAll() { renderCalendar(); if (selectedDate) updateUIForSelectedDate(); updateMasterPanelButtons(); }

    // ========== КАЛЕНДАРЬ ==========
    function renderCalendar() {
        monthYearEl.textContent = `${monthNames[currentMonth]} ${currentYear}`;
        const firstDay = new Date(currentYear, currentMonth, 1).getDay();
        const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        const prevMonthDays = new Date(currentYear, currentMonth, 0).getDate();
        let html = '';
        for (let i = firstDay - 1; i >= 0; i--) html += `<div class="day-cell other-month">${prevMonthDays - i}</div>`;
        for (let d = 1; d <= daysInMonth; d++) {
            const date = new Date(currentYear, currentMonth, d);
            const dk = formatDateKey(date);
            let cls = 'day-cell';
            if (isToday(date)) cls += ' today';
            if (!multiSelectMode && selectedDate && formatDateKey(selectedDate) === dk) cls += ' selected';
            if (multiSelectMode && selectedDaysSet.has(dk)) cls += ' selected-multi';
            if (isDayOff(dk)) cls += ' day-off';
            if (appointments[dk]?.length) cls += ' has-appointments';
            html += `<div class="${cls}" data-date="${dk}" style="animation-delay:${d * 0.02}s">${d}</div>`;
        }
        const total = firstDay + daysInMonth;
        const rem = total % 7 ? 7 - total % 7 : 0;
        for (let d = 1; d <= rem; d++) html += `<div class="day-cell other-month">${d}</div>`;
        daysGridEl.innerHTML = html;
        document.querySelectorAll('.day-cell[data-date]').forEach(cell => {
            cell.addEventListener('click', function () {
                const dk = this.dataset.date;
                if (multiSelectMode && isAdmin) {
                    if (selectedDaysSet.has(dk)) selectedDaysSet.delete(dk);
                    else selectedDaysSet.add(dk);
                    renderCalendar();
                    updateMultiButtons();
                    return;
                }
                const [y, m, d] = dk.split('-').map(Number);
                selectedDate = new Date(y, m - 1, d);
                selectedTime = null;
                updateUIForSelectedDate();
                renderCalendar();
                updateMasterPanelButtons();
            });
        });
    }

    function updateUIForSelectedDate() {
        if (!selectedDate || multiSelectMode) {
            selectedDateDisplay.innerHTML = '📅 Дата не выбрана';
            timeSelectionArea.style.display = 'none';
            bookingFormArea.style.display = 'none';
            return;
        }
        const dk = formatDateKey(selectedDate);
        selectedDateDisplay.innerHTML = `📅 ${selectedDate.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' })}`;
        timeSelectionArea.innerHTML = '<div style="font-weight:600;color:#ff7eb3;margin-bottom:5px;">Доступное время (2 часа):</div><div class="time-slots" id="timeSlotsContainer"></div>';
        timeSlotsContainer = document.getElementById('timeSlotsContainer');
        timeSelectionArea.style.display = 'block';
        if (isDateInPast(selectedDate)) {
            timeSelectionArea.innerHTML = '<div style="color:#ff7eb3;text-align:center;">⛔ Запись только с завтрашнего дня</div>';
            bookingFormArea.style.display = 'none';
            return;
        }
        if (isDayOff(dk)) {
            timeSelectionArea.style.display = 'none';
            bookingFormArea.style.display = 'none';
            return;
        }
        const booked = getBookedSlotsForDate(selectedDate);
        let slotsHtml = '';
        allTimeSlots.forEach(time => {
            const end = `${parseInt(time) + 2}:00`;
            const isB = booked.includes(time);
            const past = isPastSlot(selectedDate, time);
            let cls = 'time-slot';
            if (isB) cls += ' booked';
            else if (past) cls += ' unavailable';
            if (selectedTime === time && !isB && !past) cls += ' selected-time';
            slotsHtml += `<div class="${cls}" data-time="${time}">${time}<small> до ${end}</small></div>`;
        });
        timeSlotsContainer.innerHTML = slotsHtml;
        if (selectedTime && (booked.includes(selectedTime) || isPastSlot(selectedDate, selectedTime))) selectedTime = null;
        bookingFormArea.style.display = selectedTime ? 'flex' : 'none';
        document.querySelectorAll('.time-slot:not(.booked):not(.unavailable)').forEach(s => {
            s.addEventListener('click', function () {
                const t = this.dataset.time;
                if (getBookedSlotsForDate(selectedDate).includes(t) || isPastSlot(selectedDate, t)) {
                    updateUIForSelectedDate();
                    return;
                }
                selectedTime = t;
                updateUIForSelectedDate();
            });
        });
    }

    bookBtn.addEventListener('click', async () => {
        if (!selectedDate || !selectedTime) return;
        const dk = formatDateKey(selectedDate);
        if (isDateInPast(selectedDate)) { showMessage('Нельзя записаться на прошедший день.'); return; }
        if (isDayOff(dk)) { showMessage('Выходной.'); return; }
        const name = clientNameInput.value.trim();
        const phoneRaw = clientPhoneInput.value.trim();
        const phone = phoneRaw.replace(/\D/g, '');
        if (!name || !phoneRaw) { showMessage('Введите имя и телефон.'); return; }
        if (!/^\d{11}$/.test(phone)) { showMessage('Номер должен содержать 11 цифр.'); return; }
        if (blacklist.includes(phone)) { showMessage('Этот номер заблокирован.'); return; }
        const existing = hasAppointmentWithinWeek(phone);
        if (existing) {
            const d = new Date(existing.dateKey);
            const dateStr = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', weekday: 'short' });
            showMessage(`Вы уже записаны на ${dateStr} в ${existing.time}-${parseInt(existing.time) + 2}:00.`);
            return;
        }
        const note = clientNoteInput.value.trim();
        let designUrl = null;
        if (designFileInput.files[0]) {
            const file = designFileInput.files[0];
            const storageRef = storage.ref(`designs/${dk}_${selectedTime}_${Date.now()}`);
            await storageRef.put(file);
            designUrl = await storageRef.getDownloadURL();
        }
        try {
            await db.collection('appointments').doc(`${dk}_${selectedTime}`).set({
                time: selectedTime, name, phone, note, designUrl, userId: currentUser?.uid || 'unknown'
            });
            clientNameInput.value = ''; clientPhoneInput.value = ''; clientNoteInput.value = '';
            designFileInput.value = ''; selectedTime = null;
            updateUIForSelectedDate();
            showMessage('✅ Вы записаны!');
        } catch (e) { showMessage('Ошибка: ' + e.message); }
    });

    function hasAppointmentWithinWeek(phone) {
        const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1); tomorrow.setHours(0, 0, 0, 0);
        const weekLater = new Date(tomorrow); weekLater.setDate(weekLater.getDate() + 7);
        for (const [dateKey, apps] of Object.entries(appointments)) {
            const [y, m, d] = dateKey.split('-').map(Number);
            const date = new Date(y, m - 1, d);
            if (date >= tomorrow && date <= weekLater) {
                for (const app of apps) if (app.phone === phone) return app;
            }
        }
        return null;
    }

    aiChatBtn.addEventListener('click', () => aiChatModal.classList.add('active'));

        chatInput.value = '';
        const askAI = firebase.functions().httpsCallable('askAI');
        askAI({ message: msg })
            .then(result => addChatMessage('bot', result.data.reply))
            .catch(err => addChatMessage('bot', 'Ошибка: ' + err.message));
    }

            container.innerHTML = found.sort((a,b) => new Date(a.dateKey) - new Date(b.dateKey)).map(app => {

    // ========== АРХИВ ==========
    const archiveModal = document.createElement('div'); archiveModal.className = 'modal'; archiveModal.id = 'archiveModal';
    archiveModal.innerHTML = `
        <div class="modal-content" style="max-width:850px;">
            <h3 style="color:#ff7eb3;">📂 Архив записей</h3>
            <div class="archive-container">
                <div class="archive-years-panel" id="archiveYears"></div>
                <div class="archive-main">
                    <div class="archive-months-grid" id="archiveMonths"></div>

                </div>

        </div>`;

    let filteredAppointments = {};
    function openArchive(phone = null) {
        if (phone) {
            const cleaned = phone.replace(/\D/g, '');
            filteredAppointments = {};
            Object.entries(appointments).forEach(([dk, apps]) => {
                const filtered = apps.filter(a => a.phone === cleaned);
                if (filtered.length) filteredAppointments[dk] = filtered;
            });
        } else { filteredAppointments = { ...appointments }; }
        buildArchiveYears();
        document.getElementById('archiveModal').classList.add('active');
    }
    function buildArchiveYears() {
        const years = new Set(); Object.keys(filteredAppointments).forEach(dk => years.add(dk.split('-')[0]));
        const container = document.getElementById('archiveYears'); container.innerHTML = '';
        if (!years.size) { container.innerHTML = '<span style="color:#ddd;">Нет записей</span>'; return; }
        Array.from(years).sort((a, b) => b - a).forEach(y => {
            const btn = document.createElement('button'); btn.textContent = y;
            btn.addEventListener('click', () => {
                document.querySelectorAll('#archiveYears button').forEach(b => b.classList.remove('active'));

        });

    function buildArchiveMonths(year) {
        const monthsWithApps = new Set();
        Object.keys(filteredAppointments).forEach(dk => { const [y, m] = dk.split('-'); if (y === year) monthsWithApps.add(parseInt(m)); });
        const container = document.getElementById('archiveMonths'); container.innerHTML = '';
        for (let m = 1; m <= 12; m++) {
            const card = document.createElement('div'); card.className = 'archive-month-card' + (monthsWithApps.has(m) ? ' has-records' : '');
            card.innerHTML = `<div>${monthNames[m - 1]}</div><small style="color:${monthsWithApps.has(m) ? '#ff7eb3' : '#888'}">${monthsWithApps.has(m) ? 'есть записи' : 'нет записей'}</small>`;
            card.addEventListener('click', () => showArchiveCalendar(year, m)); container.appendChild(card);
        }
        document.getElementById('archiveCalendar').innerHTML = ''; document.getElementById('archiveDetail').innerHTML = '';
    }
    function showArchiveCalendar(year, month) {
        const calDiv = document.getElementById('archiveCalendar'); const detailDiv = document.getElementById('archiveDetail');

        const firstDay = new Date(year, month - 1, 1).getDay(); const daysInMonth = new Date(year, month, 0).getDate();
        let html = '<div style="display:grid; grid-template-columns:repeat(7,1fr); gap:5px;">';
        for (let i = 0; i < firstDay; i++) html += '<div></div>';
        for (let d = 1; d <= daysInMonth; d++) {
            const dateKey = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const apps = filteredAppointments[dateKey] || [];
            html += `<div class="archive-day-cell${apps.length ? ' has-appointments' : ''}" data-date="${dateKey}">${d}</div>`;

        html += '</div>'; calDiv.innerHTML = html;
        calDiv.querySelectorAll('[data-date]').forEach(el => {
            el.addEventListener('click', function () {
                const dk = this.dataset.date; const apps = filteredAppointments[dk] || [];
                if (!apps.length) { detailDiv.innerHTML = '<p style="color:#ddd;">Нет записей</p>'; return; }
                const [y, m, d] = dk.split('-').map(Number);

                        ${app.designUrl ? `<a href="${app.designUrl}" target="_blank" style="color:#ff7eb3;">📎 Дизайн</a>` : ''}</div>`;
                });
                detailDiv.innerHTML = list;
            });
        });
    }

                <input type="date" id="searchTo">
                <label style="color:#ddd;">⏰ Желаемое время (можно выбрать несколько)</label>
                <div class="time-dropdown" id="timeDropdown" style="position:relative; margin-bottom:15px;">
                    <button class="time-dropdown-btn" id="timeDropdownBtn" style="width:100%; padding:12px; background:rgba(255,255,255,0.07); border:1px solid rgba(255,126,179,0.3); border-radius:15px; color:#ddd; text-align:left; cursor:pointer;">
                        👆 Выберите время
                    </button>
                    <div class="time-dropdown-options" id="timeDropdownOptions" style="display:none; position:absolute; top:100%; left:0; right:0; background:rgba(25,25,45,0.95); backdrop-filter:blur(15px); border-radius:15px; margin-top:5px; padding:10px; z-index:10; border:1px solid rgba(255,126,179,0.4); max-height:200px; overflow-y:auto; box-shadow:0 10px 30px rgba(0,0,0,0.5);">
                        ${allTimeSlots.map(t => `
                            <label style="display:flex; align-items:center; padding:8px 12px; border-radius:10px; cursor:pointer; color:#ddd;"
                                   onmouseover="this.style.background='rgba(255,126,179,0.2)'"
                                   onmouseout="this.style.background='transparent'">
                                <input type="checkbox" value="${t}" style="margin-right:10px; accent-color:#ff7eb3;">
                                <span>${t} – ${parseInt(t) + 2}:00</span>
                            </label>
                        `).join('')}
                    </div>
                </div>
                <button class="modal-btn btn-primary" id="doSearch" style="width:100%;">Найти доступные окна</button>
                <div id="searchResults" style="margin-top:20px; max-height:250px; overflow-y:auto;"></div>
                <button class="modal-btn btn-secondary" id="closeSearch" style="width:100%; margin-top:10px;">Закрыть</button>
            </div>`;
        document.body.appendChild(modal);

        const timeDropdownBtn = modal.querySelector('#timeDropdownBtn');
        const timeDropdownOptions = modal.querySelector('#timeDropdownOptions');
        timeDropdownBtn.addEventListener('click', (e) => { e.stopPropagation(); timeDropdownOptions.style.display = timeDropdownOptions.style.display === 'block' ? 'none' : 'block'; });
        document.addEventListener('click', (e) => { if (!modal.querySelector('.time-dropdown').contains(e.target)) timeDropdownOptions.style.display = 'none'; });
        timeDropdownOptions.addEventListener('change', () => {
            const checked = Array.from(timeDropdownOptions.querySelectorAll('input:checked')).map(cb => cb.value);
            timeDropdownBtn.innerHTML = checked.length ? `✅ Выбрано: ${checked.join(', ')}` : '👆 Выберите время';
        });

        modal.querySelector('#doSearch').addEventListener('click', () => {
            const from = modal.querySelector('#searchFrom').valueAsDate || new Date();
            const to = modal.querySelector('#searchTo').valueAsDate || new Date(from.getFullYear(), from.getMonth() + 2, 0);
            const desiredTimes = Array.from(timeDropdownOptions.querySelectorAll('input:checked')).map(cb => cb.value);
            const results = [];
            let current = new Date(from);
            while (current <= to) {
                if (!isDateInPast(current)) {
                    const dk = formatDateKey(current);
                    if (!isDayOff(dk)) {
                        const booked = getBookedSlotsForDate(current);
                        allTimeSlots.forEach(time => {
                            if (desiredTimes.length && !desiredTimes.includes(time)) return;
                            if (!booked.includes(time) && !isPastSlot(current, time)) {
                                results.push({ date: new Date(current), time });
                            }
                        });
                    }
                }
                current.setDate(current.getDate() + 1);
            }
            const container = modal.querySelector('#searchResults');
            container.innerHTML = results.length ? results.map(r => {
                const d = r.date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', weekday: 'short' });
                return `<div style="background:rgba(255,126,179,0.08); padding:12px 15px; border-radius:12px; margin-bottom:8px; border-left:3px solid #ff7eb3; color:#ddd; display:flex; justify-content:space-between; align-items:center;">
                    <div><div style="color:#ff7eb3; font-weight:600;">${d}</div><div style="font-size:0.95rem; margin-top:3px;">${r.time} – ${parseInt(r.time) + 2}:00</div></div>
                    <span style="color:#ff7eb3; font-size:1.2rem;">✓</span></div>`;
            }).join('') : '<div style="color:#aaa; text-align:center; padding:20px;">😔 Свободных окон не найдено</div>';
        });
        modal.querySelector('#closeSearch').addEventListener('click', () => modal.remove());
    });

    // ========== ЧЁРНЫЙ СПИСОК ==========
    blacklistBtn.addEventListener('click', () => { blacklistModal.classList.add('active'); renderBlacklist(); });
    document.getElementById('addBlacklistBtn').addEventListener('click', () => {
        const phone = document.getElementById('newBlacklistPhone').value.trim();
        if (phone && /^\d{11}$/.test(phone.replace(/\D/g, ''))) {
            db.collection('blacklist').doc(phone.replace(/\D/g, '')).set({});
            document.getElementById('newBlacklistPhone').value = '';
        } else showMessage('Введите 11 цифр номера');
    });
    document.getElementById('closeBlacklistModal').addEventListener('click', () => blacklistModal.classList.remove('active'));
    function renderBlacklist() {
        const list = document.getElementById('blacklistList');
        if (!blacklist.length) { list.innerHTML = '<div style="color:#aaa;text-align:center;padding:20px;">Чёрный список пуст</div>'; return; }
        list.innerHTML = blacklist.map(phone => `
            <div style="display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,0.05);padding:12px 15px;border-radius:12px;margin-bottom:8px;color:#ddd;">
                <span>${phone}</span>
                <button data-phone="${phone}" style="background:none;border:none;color:#ff7eb3;cursor:pointer;font-size:1.2rem;">✕</button>
            </div>`).join('');
        list.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => db.collection('blacklist').doc(btn.dataset.phone).delete()));
    }
    db.collection('blacklist').onSnapshot(snap => { blacklist = snap.docs.map(d => d.id); if (blacklistModal.classList.contains('active')) renderBlacklist(); });

    // ========== АДМИН-ПАНЕЛЬ ==========
    function renderAdminBookings() {
        if (!isAdmin) { adminBookings.style.display = 'none'; return; }
        adminBookings.style.display = 'block';
        const now = new Date(); now.setHours(0, 0, 0, 0);
        const allBookings = [];
        Object.keys(appointments).sort().forEach(dateKey => {
            const [y, m, d] = dateKey.split('-').map(Number);
            const date = new Date(y, m - 1, d);
            if (date >= now) appointments[dateKey].forEach(app => allBookings.push({ ...app, date, dateKey }));
        });
        if (!allBookings.length) { bookingsContainer.innerHTML = '<div style="color:#aaa;text-align:center;padding:30px;">Нет будущих записей</div>'; return; }
        let html = '';
        allBookings.sort((a, b) => a.date - b.date).forEach(app => {
            const dateStr = app.date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', weekday: 'short' });
            html += `<div style="background:rgba(255,255,255,0.05);padding:15px;border-radius:15px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;border-left:3px solid #ff7eb3;">
                <div><div style="color:#ff7eb3;font-weight:600;">${dateStr}</div><div style="color:#ddd;"><span style="background:rgba(255,126,179,0.2);padding:2px 10px;border-radius:10px;">${app.time} – ${parseInt(app.time) + 2}:00</span></div><div style="margin-top:8px;color:#eee;">👤 ${app.name} <span style="color:#aaa;margin-left:10px;">📱 ${app.phone}</span></div>${app.note ? `<div style="color:#aaa;margin-top:5px;font-style:italic;">📝 ${app.note}</div>` : ''}${app.designUrl ? `<a href="${app.designUrl}" target="_blank" style="color:#ff7eb3;">📎 Дизайн</a>` : ''}</div>
                <button class="delete-btn" data-docid="${app.docId}" style="background:#e74c3c;color:white;border:none;border-radius:50%;width:35px;height:35px;font-size:1.2rem;cursor:pointer;">✕</button>
            </div>`;
        });
        bookingsContainer.innerHTML = html;
        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                const docId = this.dataset.docid;
                const confirmModal = document.createElement('div'); confirmModal.className = 'modal active';
                confirmModal.innerHTML = `<div class="modal-content" style="max-width:350px;"><h3 style="color:#ff7eb3;">Подтверждение</h3><p style="color:#ddd;margin:20px 0;">Удалить эту запись?</p><div style="display:flex;gap:10px;justify-content:flex-end;"><button class="modal-btn btn-secondary cancel-delete">Отмена</button><button class="modal-btn btn-primary confirm-delete">Удалить</button></div></div>`;
                document.body.appendChild(confirmModal);
                confirmModal.querySelector('.confirm-delete').addEventListener('click', async () => { await db.collection('appointments').doc(docId).delete(); confirmModal.remove(); });
                confirmModal.querySelector('.cancel-delete').addEventListener('click', () => confirmModal.remove());
            });
        });
    }

    // ========== ПОДПИСКИ НА ОБНОВЛЕНИЯ ==========
    db.collection('daysOff').onSnapshot(snap => { daysOff = snap.docs.map(d => d.id); updateMasterPanelButtons(); });
    db.collection('appointments').onSnapshot(snap => {
        appointments = {};
        snap.forEach(doc => { const data = doc.data(); const dateKey = doc.id.split('_')[0]; if (!appointments[dateKey]) appointments[dateKey] = []; appointments[dateKey].push({ ...data, docId: doc.id }); });
        renderAll();
        if (isAdmin) renderAdminBookings();
    });

    // ========== НАВИГАЦИЯ ПО МЕСЯЦАМ ==========
    document.getElementById('prevMonth').addEventListener('click', () => {
        currentMonth--;
        if (currentMonth < 0) { currentMonth = 11; currentYear--; }
        selectedDate = null; selectedTime = null; multiSelectMode = false; selectedDaysSet.clear();
        renderAll();
    });
    document.getElementById('nextMonth').addEventListener('click', () => {
        currentMonth++;
        if (currentMonth > 11) { currentMonth = 0; currentYear++; }
        selectedDate = null; selectedTime = null; multiSelectMode = false; selectedDaysSet.clear();
        renderAll();
    });
</script>
</body>
</html>
