    // Универсальные модальные окна
    function showMessage(text) {

    }
    function showConfirm(text) {
        return new Promise((resolve) => {
            document.getElementById('confirmText').textContent = text;
            confirmModal.classList.add('active');
            const onProceed = () => { cleanup(); resolve(true); };
            const onCancel = () => { cleanup(); resolve(false); };
            function cleanup() {
                document.getElementById('proceedConfirm').removeEventListener('click', onProceed);
                document.getElementById('cancelConfirm').removeEventListener('click', onCancel);
                confirmModal.classList.remove('active');
            }
            document.getElementById('proceedConfirm').addEventListener('click', onProceed);
            document.getElementById('cancelConfirm').addEventListener('click', onCancel);
        });
    }

        try {
            const doc = await db.collection('settings').doc('master').get();

            else console.warn('settings/master не найден');
        } catch (e) { console.error(e); }
    }

        if (!firstLoadCompleted) {

        }
        if (user) {
            isAdmin = !!(masterEmail && user.email === masterEmail);
            authStatus.textContent = isAdmin ? ' Мастер' : ' Клиент';
            loginBtn.textContent = isAdmin ? 'Выйти' : 'Войти как мастер';
            blacklistBtn.style.display = isAdmin ? 'inline-block' : 'none';
        } else {
            auth.signInAnonymously().catch(console.error);
            isAdmin = false;

        if (!email || !password) return showMessage('Введите email и пароль');
        auth.signInWithEmailAndPassword(email, password)
            .then(() => loginModal.classList.remove('active'))
            .catch(err => showMessage('Ошибка входа: ' + err.message));

    document.getElementById('findMyBookingsBtn').addEventListener('click', () => {
        const phone = document.getElementById('myBookingsPhone').value.trim();
        if (!phone) return showMessage('Введите номер телефона');
        const now = new Date(); now.setHours(0,0,0,0);
        let found = [];
        Object.keys(appointments).forEach(dateKey => {
            const [y,m,d] = dateKey.split('-').map(Number);
            const date = new Date(y,m-1,d);
            if (date < now) return;
            appointments[dateKey].forEach(app => {
                if (app.phone === phone) found.push({ dateKey, ...app });
            });
        });
        const container = document.getElementById('myBookingsResults');
        if (found.length === 0) {
            container.innerHTML = '<p style="color:#b3436e;">Записей не найдено.</p>';
        } else {
            let html = '';
            found.forEach(app => {
                const d = new Date(app.dateKey);
                const dateStr = d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'short'});
                html += `<div style="background:#fff0f5;padding:8px;border-radius:12px;margin-bottom:6px;">${dateStr} ${app.time}-${parseInt(app.time)+2}:00, ${app.name}</div>`;
            });
            container.innerHTML = html;
        }
    });

    function loadDataFromFirestore() {
        return Promise.all([
            db.collection('daysOff').get(),
            db.collection('appointments').get()
        ]).then(([daysSnap, apptSnap]) => {
            daysOff = daysSnap.docs.map(d => d.id);
            appointments = {};
            apptSnap.forEach(doc => {
                const data = doc.data();
                const dateKey = doc.id.split('_')[0];
                if (!appointments[dateKey]) appointments[dateKey] = [];
                appointments[dateKey].push({...data, docId: doc.id});
            });
        });
    }
    function loadBlacklist() {
        return db.collection('blacklist').get().then(snap => {
            blacklist = snap.docs.map(d => d.id);
        });
    }

    function subscribeToUpdates() {
        db.collection('appointments').onSnapshot(snap => {
            appointments = {};
            snap.forEach(doc => {
                const data = doc.data();
                const dateKey = doc.id.split('_')[0];
                if (!appointments[dateKey]) appointments[dateKey] = [];
                appointments[dateKey].push({...data, docId: doc.id});
            });
            if (mainPage.classList.contains('active')) renderAll();
            checkUpcomingAppointments();
        });
        db.collection('daysOff').onSnapshot(snap => {
            daysOff = snap.docs.map(d => d.id);
            if (mainPage.classList.contains('active')) renderAll();
        });
        db.collection('blacklist').onSnapshot(snap => {
            blacklist = snap.docs.map(d => d.id);
        });
    }

    function finishLoading() {
        setTimeout(() => {
            loader.classList.add('hidden');
            appContainer.classList.add('visible');
        }, 500);
    }

    function addAppointment(dateKey, time, name, phone) {
        return db.collection('appointments').doc(`${dateKey}_${time}`).set({time, name, phone});
    }
    function deleteAppointment(docId) {
        return db.collection('appointments').doc(docId).delete();
    }
    function setDayOff(dateKey, isOff) {
        return isOff ? db.collection('daysOff').doc(dateKey).set({}) : db.collection('daysOff').doc(dateKey).delete();
    }
    function addToBlacklist(phone) { if (!isAdmin) return; db.collection('blacklist').doc(phone).set({}); }
    function removeFromBlacklist(phone) { if (!isAdmin) return; db.collection('blacklist').doc(phone).delete(); }

    function formatDateKey(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    function isToday(d) { const t=new Date(); return d.getFullYear()===t.getFullYear() && d.getMonth()===t.getMonth() && d.getDate()===t.getDate(); }
    function isDayOff(dk) { return daysOff.includes(dk); }
    function getBookedSlotsForDate(d) { const k=formatDateKey(d); return appointments[k] ? appointments[k].map(a=>a.time) : []; }
    function isPastSlot(d,time) { if(!isToday(d)) return false; const [h,m]=time.split(':').map(Number); const end=new Date(d.getFullYear(),d.getMonth(),d.getDate(),h+2,m); return end <= new Date(); }
    function isDateInPast(d) { const tomorrow=new Date(); tomorrow.setDate(tomorrow.getDate()+1); tomorrow.setHours(0,0,0,0); return new Date(d.getFullYear(),d.getMonth(),d.getDate()) < tomorrow; }

    function renderAll() {
        renderCalendar();
        updateMasterToolbar();
        if (selectedDate) updateUIForSelectedDate();
        renderAdminBookings();
    }

    function renderCalendar() {
        monthYearEl.textContent = `${monthNames[currentMonth]} ${currentYear}`;
        const firstDay = new Date(currentYear, currentMonth, 1).getDay();
        const daysInMonth = new Date(currentYear, currentMonth+1, 0).getDate();
        const prevMonthDays = new Date(currentYear, currentMonth, 0).getDate();
        let html = '';
        for (let i = firstDay-1; i >= 0; i--) html += `<div class="day-cell other-month">${prevMonthDays - i}</div>`;
        for (let d=1; d<=daysInMonth; d++) {
            const date = new Date(currentYear, currentMonth, d);
            const dk = formatDateKey(date);
            let cls = 'day-cell';
            if (isToday(date)) cls += ' today';
            if (selectedDate && !multiSelectMode && formatDateKey(selectedDate)===dk) cls += ' selected';
            if (multiSelectMode && selectedDaysSet.has(dk)) cls += ' selected-multi';
            if (isDayOff(dk)) cls += ' day-off';
            if (appointments[dk]?.length) cls += ' has-appointments';
            html += `<div class="${cls}" data-date="${dk}" style="animation-delay:${d*0.02}s">${d}</div>`;
        }
        const total = firstDay + daysInMonth;
        const rem = total%7 ? 7 - total%7 : 0;
        for (let d=1; d<=rem; d++) html += `<div class="day-cell other-month">${d}</div>`;
        daysGridEl.innerHTML = html;
        document.querySelectorAll('.day-cell[data-date]').forEach(cell => {
            cell.addEventListener('click', function() {
                const dk = this.dataset.date;
                if (multiSelectMode && isAdmin) {
                    selectedDaysSet.has(dk) ? selectedDaysSet.delete(dk) : selectedDaysSet.add(dk);
                    renderCalendar(); updateMasterToolbar(); return;
                }
                const [y,m,d] = dk.split('-').map(Number);
                selectedDate = new Date(y,m-1,d);
                selectedTime = null;
                updateUIForSelectedDate();
                renderCalendar();
                updateMasterToolbar();
            });
        });
    }

    function updateMasterToolbar() {
        if (!isAdmin) { masterToolbar.classList.remove('visible'); return; }
        masterToolbar.classList.add('visible');
        if (selectedDate && !multiSelectMode) {
            toggleDayOffBtn.style.display='inline-block';
            toggleDayOffBtn.textContent = isDayOff(formatDateKey(selectedDate)) ? 'Сделать рабочим' : 'Сделать выходным';
        } else toggleDayOffBtn.style.display='none';
        multiSelectBtn.textContent = multiSelectMode ? 'Завершить выбор' : 'Выбрать несколько';
        if (multiSelectMode && selectedDaysSet.size > 0) {
            applyMultiBtn.style.display='inline-block';
            applyMultiWorkBtn.style.display='inline-block';
        } else {
            applyMultiBtn.style.display='none';
            applyMultiWorkBtn.style.display='none';

    }

    toggleDayOffBtn.addEventListener('click', () => {
        if (!selectedDate) return;
        setDayOff(formatDateKey(selectedDate), !isDayOff(formatDateKey(selectedDate)));
    });
    multiSelectBtn.addEventListener('click', () => {
        multiSelectMode = !multiSelectMode;
        if (!multiSelectMode) selectedDaysSet.clear();
        selectedDate = null; selectedTime = null;
        timeSelectionArea.style.display='none'; bookingFormArea.style.display='none';
        renderCalendar(); updateMasterToolbar(); updateUIForSelectedDate();
    });
    applyMultiBtn.addEventListener('click', () => {
        selectedDaysSet.forEach(dk => { if (!isDayOff(dk)) setDayOff(dk, true); });
        selectedDaysSet.clear(); multiSelectMode = false;
        renderCalendar(); updateMasterToolbar(); updateUIForSelectedDate();
    });
    applyMultiWorkBtn.addEventListener('click', () => {
        selectedDaysSet.forEach(dk => { if (isDayOff(dk)) setDayOff(dk, false); });
        selectedDaysSet.clear(); multiSelectMode = false;
        renderCalendar(); updateMasterToolbar(); updateUIForSelectedDate();
    });

    function updateUIForSelectedDate() {
        if (!selectedDate || multiSelectMode) {
            selectedDateDisplay.innerHTML='<span> Дата не выбрана</span>';
            timeSelectionArea.style.display='none'; bookingFormArea.style.display='none';
            return;
        }
        const dk = formatDateKey(selectedDate);
        selectedDateDisplay.innerHTML=`<span> ${selectedDate.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}</span>`;
        timeSelectionArea.innerHTML = `<div style="font-weight:600;color:#5c2d43;margin-bottom:5px;">Доступное время (2 часа):</div><div class="time-slots" id="timeSlotsContainer"></div>`;
        timeSlotsContainer = document.getElementById('timeSlotsContainer');
        timeSelectionArea.style.display='block';
        if (isDateInPast(selectedDate)) {
            timeSelectionArea.innerHTML = '<div class="past-message">Запись только с завтрашнего дня</div>';
            bookingFormArea.style.display='none'; return;
        }
        if (isDayOff(dk)) { timeSelectionArea.style.display='none'; bookingFormArea.style.display='none'; return; }
        const booked = getBookedSlotsForDate(selectedDate);
        let slotsHtml = '';
        allTimeSlots.forEach(time => {
            const end = `${parseInt(time)+2}:00`;
            const isB = booked.includes(time);
            const past = isPastSlot(selectedDate, time);
            let cls = 'time-slot';
            if (isB) cls+=' booked'; else if (past) cls+=' unavailable';
            if (selectedTime===time && !isB && !past) cls+=' selected-time';
            slotsHtml += `<div class="${cls}" data-time="${time}">${time}<small>до ${end}</small></div>`;
        });
        timeSlotsContainer.innerHTML = slotsHtml;
        if (selectedTime && (booked.includes(selectedTime) || isPastSlot(selectedDate,selectedTime))) selectedTime=null;
        bookingFormArea.style.display = selectedTime ? 'flex' : 'none';
        document.querySelectorAll('.time-slot:not(.booked):not(.unavailable)').forEach(s=>{
            s.addEventListener('click', function(){
                const t = this.dataset.time;
                if (getBookedSlotsForDate(selectedDate).includes(t) || isPastSlot(selectedDate,t)) { updateUIForSelectedDate(); return; }
                selectedTime = t; updateUIForSelectedDate();
            });
        });
    }

    bookBtn.addEventListener('click', async () => {
        if (!selectedDate || !selectedTime) return;
        const dk = formatDateKey(selectedDate);
        if (isDateInPast(selectedDate)) { showMessage('Нельзя записаться на прошедший день.'); return; }
        if (isDayOff(dk)) { showMessage('Выходной.'); return; }
        const name = clientNameInput.value.trim(), phone = clientPhoneInput.value.trim();
        if (!name || !phone) { showMessage('Введите имя и телефон.'); return; }
        if (blacklist.includes(phone)) { showMessage('Простите, для Вас запись недоступна.'); return; }
        try {
            await addAppointment(dk, selectedTime, name, phone);
            clientNameInput.value=''; clientPhoneInput.value=''; selectedTime=null;
            updateUIForSelectedDate(); showMessage('Вы записаны!');
        } catch(e) { showMessage('Ошибка: '+e.message); }
    });

    function renderAdminBookings() {
        if (!isAdmin) { adminBookings.style.display='none'; return; }
        adminBookings.style.display='block';
        const now = new Date(); now.setHours(0,0,0,0);
        let items = '';
        Object.keys(appointments).sort().forEach(dk => {
            const [y,m,d] = dk.split('-').map(Number);
            const date = new Date(y,m-1,d);
            if (date < now) return;
            appointments[dk].forEach(app => {
                const end = `${parseInt(app.time)+2}:00`;
                items += `<div class="booking-item">
                    <div><strong>${date.toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'short'})}</strong> ${app.time}-${end}<br><small>${app.name} — ${app.phone}</small></div>
                    <button class="delete-btn" data-docid="${app.docId}">✕ Удалить</button>

                const confirmed = await showConfirm('Удалить эту запись?');
                if (confirmed) deleteAppointment(docId);
            });
        });
    }

    // ========== АРХИВ (исправлено) ==========
    function showArchive() {
        if (isAdmin) {
            // Мастер видит все записи
            mainPage.classList.remove('active');
            archivePage.classList.add('active');
            yearsSidebar.innerHTML = '';
            archiveContent.innerHTML = '';
            filteredAppointments = { ...appointments }; // используем глобальный объект
            buildYearsList(filteredAppointments);
        } else {
            // Клиент: запрашиваем номер телефона
            clientArchiveModal.classList.add('active');
        }
    }
    document.getElementById('showClientArchiveBtn').addEventListener('click', () => {
    const phone = document.getElementById('clientArchivePhone').value.trim();
    if (!phone) return showMessage('Введите номер телефона');

    // Фильтруем appointments по номеру
    const now = new Date(); now.setHours(0,0,0,0);
    filteredAppointments = {};
    Object.keys(appointments).forEach(dateKey => {
        const apps = appointments[dateKey];
        apps.forEach(app => {
            if (app.phone === phone) {
                if (!filteredAppointments[dateKey]) filteredAppointments[dateKey] = [];

    archiveContent.innerHTML = '';
    buildYearsList(filteredAppointments);
    });
    archiveBtn.addEventListener('click', showArchive);
    backFromArchive.addEventListener('click', () => {
    archivePage.classList.remove('active');
    mainPage.classList.add('active');
    selectedArchiveYear = null;
    selectedArchiveMonth = null;
    filteredAppointments = {};
    clientArchivePhone = null;
    });

    function buildYearsList(appointmentsObj) {
    const years = new Set();
    Object.keys(appointmentsObj).forEach(dk => years.add(dk.split('-')[0]));
    yearsSidebar.innerHTML = '';
    if (years.size === 0) {
        yearsSidebar.innerHTML = '<small style="color:#b3436e;">Нет записей</small>';
        archiveContent.innerHTML = '<div class="no-selection-message" style="width:100%; text-align:center;">Нет данных</div>';
        return;
    }
    const sorted = Array.from(years).sort((a,b)=>b-a);
    sorted.forEach(y => {
        const btn = document.createElement('button');
        btn.textContent = y;
        btn.dataset.year = y;
        btn.addEventListener('click', function() {
            selectedArchiveYear = this.dataset.year;
            selectedArchiveMonth = null;
            yearsSidebar.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            buildMonthsList(selectedArchiveYear, appointmentsObj);
        });
        yearsSidebar.appendChild(btn);
    });
    if (sorted.length) yearsSidebar.querySelector('button').click();
}

    function buildMonthsList(year, appointmentsObj) {
    archiveContent.innerHTML = '';
    const monthsWithApps = new Set();
    Object.keys(appointmentsObj).forEach(dk => {
        const [y,m] = dk.split('-');
        if (y === year) monthsWithApps.add(parseInt(m));
    });
    const allMonths = Array.from({length:12}, (_,i)=>i+1);
    allMonths.forEach(m => {
        const card = document.createElement('div');
        card.className = 'month-card';
        card.dataset.month = m;
        const has = monthsWithApps.has(m);
        card.innerHTML = `${monthNames[m-1]}<br><small>${has ? 'есть записи' : 'нет записей'}</small>`;
        card.addEventListener('click', () => {
            selectedArchiveMonth = m;
            showCalendarForMonth(year, m, appointmentsObj);
        });
        archiveContent.appendChild(card);
    });
}

    function showCalendarForMonth(year, month, appointmentsObj) {
    archiveContent.innerHTML = '';
    const backBtn = document.createElement('button');
    backBtn.className = 'back-btn';
    backBtn.textContent = '← К месяцам';
    backBtn.addEventListener('click', () => buildMonthsList(year, appointmentsObj));
    archiveContent.appendChild(backBtn);

    const calDiv = document.createElement('div');
    calDiv.className = 'days-grid';
    const firstDay = new Date(year, month-1, 1).getDay();
    const daysInMonth = new Date(year, month, 0).getDate();
    let html = '';
    for (let i=0; i<firstDay; i++) html += '<div class="day-cell other-month"></div>';
    for (let d=1; d<=daysInMonth; d++) {
        const date = new Date(year, month-1, d);
        const dk = formatDateKey(date);
        const apps = appointmentsObj[dk] || [];
        let cls = 'day-cell';
        if (apps.length) cls += ' has-appointments';
        html += `<div class="${cls}" data-date="${dk}">${d}</div>`;
    }
    calDiv.innerHTML = html;
    archiveContent.appendChild(calDiv);

    const detailDiv = document.createElement('div');
    detailDiv.className = 'archive-detail';
    detailDiv.id = 'archiveDayDetail';
    detailDiv.style.display = 'none';
    archiveContent.appendChild(detailDiv);

    calDiv.querySelectorAll('.day-cell[data-date]').forEach(cell => {
        cell.addEventListener('click', function() {
            const dk = this.dataset.date;
            const dayApps = appointmentsObj[dk] || [];
            const detail = document.getElementById('archiveDayDetail');
            if (dayApps.length === 0) {
                detail.style.display = 'block';
                detail.innerHTML = '<h4>Нет записей на этот день</h4>';
            } else {
                const [y,m,d] = dk.split('-').map(Number);
                const dateStr = new Date(y,m-1,d).toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'short'});
                let listHtml = `<h4>${dateStr}</h4>`;
                dayApps.forEach(app => {
                    const end = `${parseInt(app.time)+2}:00`;
                    listHtml += `<div class="booking-info"><strong>${app.time}-${end}</strong> — ${app.name} (${app.phone})</div>`;
                });
                detail.innerHTML = listHtml;
                detail.style.display = 'block';
            }
        });
    });
}

    // Поиск окна
    searchWindowBtn.addEventListener('click', () => searchModal.classList.add('active'));
    document.getElementById('searchBtn').addEventListener('click', () => {
        const startDate = document.getElementById('searchStartDate').valueAsDate || new Date();
        const endDate = document.getElementById('searchEndDate').valueAsDate || new Date(startDate.getFullYear(), startDate.getMonth()+2, 0);
        const desiredTime = document.getElementById('searchTime').value;
        const results = [];
        const current = new Date(startDate);
        while (current <= endDate) {
            if (!isDateInPast(current)) {
                const dk = formatDateKey(current);
                if (!isDayOff(dk)) {
                    const booked = getBookedSlotsForDate(current);
                    allTimeSlots.forEach(time => {
                        if (desiredTime && time !== desiredTime) return;
                        if (!booked.includes(time) && !isPastSlot(current, time)) {
                            results.push({ date: new Date(current), time });
                        }
                    });
                }
            }
            current.setDate(current.getDate()+1);
        }
        const container = document.getElementById('searchResults');
        if (results.length === 0) {
            container.innerHTML = '<p style="color:#b3436e;">Нет свободных окон.</p>';
        } else {
            container.innerHTML = results.map(r => {
                const d = r.date.toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'short'});
                return `<div style="margin-bottom:6px;background:#fff0f5;padding:6px 12px;border-radius:12px;">${d} ${r.time}-${parseInt(r.time)+2}:00</div>`;
            }).join('');
        }
    });

    // Чёрный список
    blacklistBtn.addEventListener('click', () => { blacklistModal.classList.add('active'); renderBlacklist(); });
    document.getElementById('addBlacklistBtn').addEventListener('click', () => {
        const phone = document.getElementById('newBlacklistPhone').value.trim();
        if (phone) { addToBlacklist(phone); renderBlacklist(); }
    });
    function renderBlacklist() {
        const list = document.getElementById('blacklistList');
        list.innerHTML = blacklist.map(phone => `
            <div class="blacklist-item">
                <span>${phone}</span>
                <button data-phone="${phone}">✕</button>
            </div>
        `).join('');
        list.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function() { removeFromBlacklist(this.dataset.phone); });
        });
    }

    // Уведомления
    if ('Notification' in window) Notification.requestPermission();
    function checkUpcomingAppointments() {
        if (Notification.permission !== 'granted') return;
        const now = new Date();
        const sevenDaysLater = new Date();
        sevenDaysLater.setDate(now.getDate() + 7);
        const notified = JSON.parse(localStorage.getItem('notified_appointments') || '[]');
        Object.entries(appointments).forEach(([dateKey, apps]) => {
            const [y, m, d] = dateKey.split('-').map(Number);
            const appointmentDate = new Date(y, m-1, d);
            if (appointmentDate >= now && appointmentDate <= sevenDaysLater) {
                apps.forEach(app => {
                    const id = `${dateKey}_${app.time}`;
                    if (!notified.includes(id)) {
                        const daysLeft = Math.ceil((appointmentDate - now) / (1000*60*60*24));
                        new Notification('Manik', {
                            body: `${app.name}, у вас запись ${app.time} через ${daysLeft} дн. (${appointmentDate.toLocaleDateString()})`,
                            icon: 'icon.png'
                        });
                        notified.push(id);
                    }
                });
            }
        });
        localStorage.setItem('notified_appointments', JSON.stringify(notified));
    }
    setInterval(checkUpcomingAppointments, 300000);

    document.getElementById('prevMonth').addEventListener('click', ()=>{ currentMonth--; if(currentMonth<0){currentMonth=11;currentYear--;} resetSelection(); renderAll(); });
    document.getElementById('nextMonth').addEventListener('click', ()=>{ currentMonth++; if(currentMonth>11){currentMonth=0;currentYear++;} resetSelection(); renderAll(); });
    function resetSelection() { selectedDate=null; selectedTime=null; multiSelectMode=false; selectedDaysSet.clear(); timeSelectionArea.style.display='none'; bookingFormArea.style.display='none'; }
    function updateUIForRole() {
        adminBookings.style.display = isAdmin ? 'block' : 'none';
        if (!isAdmin) { multiSelectMode=false; selectedDaysSet.clear(); }
        updateMasterToolbar();
        if (selectedDate) updateUIForSelectedDate(); else { timeSelectionArea.style.display='none'; bookingFormArea.style.display='none'; }
    }

    subscribeToUpdates();
</script>

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('SW registered'))
                .catch(err => console.log('SW error', err));
        });
    }
</script>
